<details id="fr-12">
<summary><b>FR-12 — Engine performance data access (library dependency)</b></summary>

**Statement.** The propulsion module shall request performance at the operating points needed for sizing and reporting. Interpolation and offtake corrections are provided by `libs/engine`, not implemented by this module; they are dependencies to verify separately.

**Src:** `engine_design/rubber/rubber_design.cpp`, `report/report_data.cpp`; dependency: `libs/engine/src/{engine,engine_data}.cpp`.

<details id="fr-12-1">
<summary><b>FR-12.1 — Request operating-point data</b></summary>

**What it does:** Sizing and reporting evaluate an engine at selected Mach numbers, altitudes and N1 settings or ratings.

**Implemented by:** `Rubber::calculate_bucket_point()`, `report::BucketCurve::from_engine_data()` and calls to `Engine::calculate_N1_with_penalties()`.

**Why it is needed:** Engine thrust and fuel flow depend on the flight condition and operating point.

<details><summary><b>Software requirements</b></summary>

The module supplies the condition and requested offtakes; `Engine` evaluates the requested operating point.

</details>
</details>

<details id="fr-12-2">
<summary><b>FR-12.2 — Interpolated deck values</b></summary>

**What it does:** The engine library obtains values between available performance-deck points.

**Implemented by:** `EngineData::get_deck_value()` in `libs/engine`; the interpolation is not implemented in `propulsion_design/src`.

**Why it is needed:** The requested flight and N1 conditions need not coincide with the deck grid.

<details><summary><b>Software requirements</b></summary>

Treat interpolation as an external-library contract, not as a propulsion-module algorithm or a propulsion-module unit-test result.

</details>
</details>

<details id="fr-12-3">
<summary><b>FR-12.3 — Offtake corrections</b></summary>

**What it does:** The module passes bleed-air and shaft-power demands to the engine library, which adjusts the evaluated performance.

**Implemented by:** `Rubber::calculate_bucket_point()`, `report::BucketCurve::from_engine_data()` and `Engine::calculate_offtake_correction()`.

**Why it is needed:** Sizing and reporting should reflect the performance penalty of systems drawing air or power from the engine.

<details><summary><b>Software requirements</b></summary>

See FR-4.6 and the shaft-power unit inconsistency recorded as O-2; this subsection does not establish which unit is intended.

</details>
</details>

</details>

<details id="fr-13">
<summary><b>FR-13 — Engine-data scaling (module rules and library dependencies)</b></summary>

**Statement.** The module shall scale reference-engine thrust, dimensions and dry mass as described in FR-4.3–FR-4.5. Other scaled quantities below are provided by `libs/engine` and are recorded as dependencies, not additional module implementations.

**Scaling rule:** for a base value $q_0$, scale factor $k$ and exponent $x$, $q=q_0 k^x$.

<details id="fr-13-1">
<summary><b>FR-13.1 — Quantities proportional to scale</b></summary>

**What it does:** The engine library scales thrust, fuel flow, deck mass flow, maximum bleed and maximum shaft offtake linearly with $k$. Its LTO fuel-flow accessor also scales linearly, but the propulsion module does not use that accessor in its documented workflow.

**Implemented by:** `Engine::{get_thrust, get_fuelflow, get_max_shaft_power_offtake_engine, get_LTO_fuelflow}()` and the mass-flow/bleed calculations in `libs/engine/src/engine.cpp`.

**Why it is needed:** A scaled reference engine must produce performance consistent with its scale factor.

<details><summary><b>Software requirements</b></summary>

Module-level scale-factor selection is FR-4.3; these performance accessors belong to the engine library.

</details>
</details>

<details id="fr-13-2">
<summary><b>FR-13.2 — Dimensions and dry mass</b></summary>

**What it does:** Height, width and diameter use $k^{0.5}$, length uses $k^{0.4}$, and dry mass uses $k^{1.1}$ before the mass technology factor (Eq. 8–9).

**Implemented by:** `Rubber::operator()` for the supported engine types; equivalent library accessors are `Engine::get_engine_dimensions()` and `Engine::get_dry_mass()`.

**Why it is needed:** Nacelle, placement, pylon and mass analysis need the dimensions and mass of the sized engine.

<details><summary><b>Software requirements</b></summary>

See FR-4.4, FR-4.5 and the duplicated-scaling observation O-12.

</details>
</details>

<details id="fr-13-3">
<summary><b>FR-13.3 — LTO emission indices</b></summary>

**What it does:** The engine library returns its stored LTO emission indices without scaling them by $k$ (exponent 0). This module does not request or export those indices in the workflow described here.

**Implemented by:** `Engine::get_LTO_emission_index()` in `libs/engine`.

**Why it is needed:** This distinguishes an engine-library data rule from quantities that change with engine scale.

<details><summary><b>Software requirements</b></summary>

Library dependency only; it should not be counted as propulsion-module requirement coverage without a test that actually exercises it.

</details>
</details>

<details id="fr-13-4">
<summary><b>FR-13.4 — TSFC under proportional scaling</b></summary>

**What it does:** If both thrust and fuel flow are multiplied by the same nonzero $k$ with no other correction changed, their ratio $TSFC=\dot w_f/F$ is unchanged.

**Implemented by:** The proportional factors in `Engine::get_thrust()` and `Engine::get_fuelflow()`; this statement is limited to scaling alone, not changed offtakes or fuel properties.

**Why it is needed:** It separates the effect of engine size from effects that change fuel efficiency.

<details><summary><b>Software requirements</b></summary>

This is a consequence of the scaling equations, not a separate operation performed by the module.

</details>
</details>

</details>

<details id="fr-14">
<summary><b>FR-14 — Supported propulsion configurations</b></summary>

**Statement.** The module shall create recognized propulsor and energy-carrier combinations and dispatch them only to design strategies with implemented overloads. A configuration accepted by an early stage may still be rejected by a later stage.

**Src:** `utility.cpp`, `propulsion_strategy.h`, `integration/default/`, `pylon/default/`.

| Propulsor / carrier | Current processing boundary |
|---|---|
| Turbofan / kerosene or liquid hydrogen | Sizing, nacelle, placement, pylon and mass strategies implemented. |
| Open-rotor fan / kerosene | Strategies implemented, but the fuselage-top placement accepted by integration is rejected at the pylon stage when geometry exists (FR-7.2). |
| Open-rotor fan / liquid hydrogen | Rejected during propulsor creation. |
| Turboprop / kerosene or liquid hydrogen | Object can be created; design strategy overloads are not implemented and throw. |

<details id="fr-14-1">
<summary><b>FR-14.1 — Dispatch to implemented strategies</b></summary>

**What it does:** `PropulsionDesign::run()` visits each typed propulsor and calls the five strategies in sequence. The base strategy rejects unimplemented type overloads.

**Implemented by:** `PropulsionDesign::run()` and `PropulsionStrategy::operator()` overloads.

**Why it is needed:** A propulsor should not silently pass through a stage that has no implementation for its type.

<details><summary><b>Software requirements</b></summary>

See FR-1.3 for the dispatch order and FR-6.1/FR-7.2 for placement-specific support checks.

</details>
</details>

<details id="fr-14-2">
<summary><b>FR-14.2 — Reject unsupported combinations</b></summary>

**What it does:** Propulsor creation rejects unknown types, carriers and unsupported combinations; individual strategies reject unsupported positions or types when reached.

**Implemented by:** `utility::create_engine()`, `PropulsionStrategy` defaults and the integration/pylon support checks.

**Why it is needed:** Unsupported designs must fail visibly instead of yielding incomplete results.

<details><summary><b>Software requirements</b></summary>

See FR-2.2, FR-6.1 and FR-7.2 for the stage-specific behaviour.

</details>
</details>

<details id="fr-14-3">
<summary><b>FR-14.3 — Diagnostic context</b></summary>

**What it does:** A rejecting function reports its own error message. These messages do not consistently include both a propulsor ID and a design-stage name.

**Implemented by:** Error paths in `utility::create_engine()` and the selected strategy methods; `Module::execute()` reports lifecycle failures (FR-1.7).

**Why it is needed:** The user needs to identify why a requested configuration could not be designed.

<details><summary><b>Software requirements</b></summary>

Treat richer ID/stage diagnostics as a possible improvement, not as behaviour already guaranteed by the current code.

</details>
</details>

</details>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script>
const storageKeys = ['overallFeedback', 'sectionFeedback', 'actionFeedback'];
const saveFeedback = () => {
  storageKeys.forEach((key) => {
    const value = document.getElementById(key)?.value ?? '';
    localStorage.setItem(`propulsion-review-${key}`, value);
  });
  const status = document.getElementById('feedbackStatus');
  if (status) {
    status.textContent = 'Feedback saved locally.';
    status.style.color = '#1f7a4d';
  }
};

const clearFeedback = () => {
  storageKeys.forEach((key) => {
    const field = document.getElementById(key);
    if (field) field.value = '';
    localStorage.removeItem(`propulsion-review-${key}`);
  });
  const status = document.getElementById('feedbackStatus');
  if (status) {
    status.textContent = 'Feedback cleared.';
    status.style.color = '#7b6f00';
  }
};

let src=document.getElementById('md').textContent;
const math=[];
src=src.replace(/\$\$([\s\S]+?)\$\$/g,(m,t)=>{math.push([t,true]);return '@@M'+(math.length-1)+'@@'});
src=src.replace(/\$([^$\n]+?)\$/g,(m,t)=>{math.push([t,false]);return '@@M'+(math.length-1)+'@@'});
let h=marked.parse(src);
h=h.replace(/@@M(\d+)@@/g,(m,i)=>katex.renderToString(math[i][0],{displayMode:math[i][1],throwOnError:false}));
document.getElementById('out').innerHTML=h;

storageKeys.forEach((key) => {
  const field = document.getElementById(key);
  if (!field) return;
  const saved = localStorage.getItem(`propulsion-review-${key}`) || '';
  field.value = saved;
  field.addEventListener('input', saveFeedback);
});

document.getElementById('saveFeedback')?.addEventListener('click', saveFeedback);
document.getElementById('clearFeedback')?.addEventListener('click', clearFeedback);
</script></body></html>
