# Introduction

**Module name:** `aircraft_design/propulsion_design` (UNICADO)

**Software release version:** 0.5.0

This document defines the functional requirements of the propulsion design module in UNICADO. It is a living document and shall be updated whenever a change is made to the `propulsion_design` module. It provides a baseline for review, traceability, and maintenance.

---

## 0. How to read this document

| Item | Meaning |
|---|---|
| **FR-n** | A top-level functional requirement (a major capability of the module). |
| **FR-n.m** | A sub-function: one concrete behaviour inside FR-n. |
| **Eq. (n)** | An analytical equation implemented in the code. Equation numbers are global. |
| **Src** | The file(s) where the behaviour is implemented, relative to `src/`. |
| **[Ata10]** | Atanasov (2010) placement/sizing rules cited in the code (page numbers as cited in the code). |
| **[Ray12]** | Raymer, *Aircraft Design: A Conceptual Approach*, p. 285 (engine scaling). |
| **[Pet13]** | Regression of LTH engine/nacelle/pylon mass data, cited in `mass/default/turbofan.cpp`. |

Requirements in this document were recovered from the `propulsion_design` source code and verified through a code walkthrough.

## Functional requirements for the propulsion_design module

At the UNICADO system level, the aircraft design process defines propulsion needs through the user-specified propulsion architecture and the required thrust or power and system offtakes supplied by the design loop. These system-level requirements map to the `propulsion_design` module. The module exists to translate those needs into a propulsion design by sizing the engines, designing and integrating the propulsion system with the aircraft, and providing engine and integration outputs for downstream tools.

The functional requirements below describe how the module fulfills its role. They are grouped into functional categories and decomposed into sub-functional requirements. Each sub-functional requirement explains why its behavior is needed, while its **Software requirements** subsection identifies how the software implements that behavior.
<details id="fr-1">
<summary><b>FR-1 - Module lifecycle and strategy orchestration</b></summary>

**Statement.** The module shall initialize from runtime configuration and the aircraft exchange file, create aircraft geometry and propulsors, validate inputs, and initialize the selected design strategies [FR-1.1](#fr-1-1); select the configured strategy for each design domain [FR-1.2](#fr-1-2); and process each supported propulsor through engine sizing, nacelle design, placement, pylon design and mass analysis in dependency order [FR-1.3](#fr-1-3). After design, it shall update the aircraft exchange file and prepare report data when enabled [FR-1.4](#fr-1-4), generate configured reports and plots [FR-1.5](#fr-1-5), and save the aircraft exchange file and strategy outputs [FR-1.6](#fr-1-6). If execution cannot continue, it shall report the error and return failure [FR-1.7](#fr-1-7). It shall also provide status and diagnostic messages [FR-1.8](#fr-1-8) and support creation from a runtime configuration file without command-line arguments [FR-1.9](#fr-1-9). The module follows the lifecycle `initialize` -> `run` -> `update` -> `report` -> `save`.

**Src:** `propulsion_design.cpp`, `propulsion_strategy.h`, `main.cpp`

<details id="fr-1-1">
<summary><b>FR-1.1 - Initialization</b></summary>

**What it does:** Opens the configuration XML and aircraft XML. Sets the reference offset to (0, 0, 0). Builds aircraft geometry and propulsors, sorts the propulsors, validates the input, then selects and initializes the five strategies.

**Implemented by:** `PropulsionDesign::initialize()`, `PropulsionDesign::create_aircraft_geometry()`, `PropulsionDesign::create_propulsors()`, `PropulsionDesign::sort_propulsors()`, `PropulsionDesign::check_validity()`, and the five `select_*()` functions.

**Why it is needed:** The module needs a defined startup sequence so that input, geometry and strategies are ready, and invalid input is caught, before engine design begins.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign::initialize()</code></summary>

**File:** `propulsion_design.cpp`

Opens the configuration and aircraft XML, sets `reference_offset = (0,0,0)`, creates aircraft geometry and propulsors, sorts propulsors, validates the setup, then selects and initializes the five strategies.

</details>

</details>
</details>

<details id="fr-1-2">
<summary><b>FR-1.2 - Strategy selection</b></summary>

**What it does:** Reads `program_settings/method/{engine_designer, propulsion_integrator, nacelle_designer, pylon_designer, mass_analyzer}`. Engine designer must be `Rubber`; the other four must be `Default`. Unsupported values raise a runtime error.

**Implemented by:** The five `PropulsionDesign::select_*()` strategy selectors.

**Why it is needed:** Configuration selects the implementation used at each design stage and rejects methods the current module cannot run.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>select_engine_designer()</code></summary>

**File:** `propulsion_design.cpp`

Reads the design flight condition. `Rubber` creates `design::Rubber`; any other method raises an unsupported-method error.

</details>

<details>
<summary><code>select_propulsion_integrator()</code></summary>

**File:** `propulsion_design.cpp`

Counts engines by parent component. `Default` creates `integration::Default` with the configuration, aircraft geometry and engine counts; other methods are rejected.

</details>

<details>
<summary><code>select_nacelle_designer(), select_pylon_designer(), select_mass_analyzer()</code></summary>

**File:** `propulsion_design.cpp`

Each selects its `Default` implementation and rejects unsupported methods. The nacelle and pylon designers receive the geometry directory; the pylon designer also receives aircraft geometry.

</details>

</details>
</details>

<details id="fr-1-3">
<summary><b>FR-1.3 - Per-propulsor design loop</b></summary>

**What it does:** For each propulsor, runs engine sizing, nacelle design, placement, pylon design and mass analysis in that order. Strategies are dispatched by propulsor type. The module runs validation again after the loop.

**Implemented by:** `PropulsionDesign::run()`, `PropulsionDesign::check_validity()`, `PropulsionStrategy`, and `Module::execute()`.

**Why it is needed:** Each stage depends on results from earlier stages, so they must run in order for every supported propulsor.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign::run()</code></summary>

**File:** `propulsion_design.cpp`

Dispatches each propulsor through the engine designer, nacelle designer, propulsion integrator, pylon designer and mass analyzer, then checks validity again.

</details>

<details>
<summary><code>PropulsionStrategy</code></summary>

**File:** `propulsion_strategy.h`

Provides the common interface for the five strategies. An unimplemented propulsion-type overload throws `std::invalid_argument`, which rejects unsupported types during dispatch.

</details>

</details>
</details>

<details id="fr-1-4">
<summary><b>FR-1.4 - Update</b></summary>

**What it does:** Attempts to restore the original propulsor order, writes propulsion results to the aircraft XML, updates strategies and prepares report data when reporting is enabled. Order restoration is not guaranteed for every permutation (O-21).

**Implemented by:** `PropulsionDesign::update()` and `report::generate_data()`.

**Why it is needed:** Final propulsion results must be added to the shared aircraft file and report data prepared from the completed design.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign::update()</code></summary>

**File:** `propulsion_design.cpp`

Attempts to restore the original propulsor order, inserts the reference position, total propulsion mass and individual engines into the aircraft XML, converts engine frames, updates strategies and builds report data when reporting is enabled.

</details>

</details>
</details>

<details id="fr-1-5">
<summary><b>FR-1.5 - Report</b></summary>

**What it does:** Writes the XML report when enabled. If HTML reporting is disabled, prints a warning and returns without plots. Otherwise it creates the HTML report and, when plotting is enabled, SVG plots.

**Implemented by:** `PropulsionDesign::report()`, `PropulsionDesign::create_xml_report()`, `PropulsionDesign::create_html_report()`, and `PropulsionDesign::create_plots()`.

**Why it is needed:** Reporting and plotting are optional, so the module must handle each configured switch combination.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign::report()</code></summary>

**File:** `propulsion_design.cpp`

Creates the XML report when `xmlOn` is enabled. It returns with a warning when HTML reporting is off; otherwise it generates HTML and the configured plots.

</details>

</details>
</details>

<details id="fr-1-6">
<summary><b>FR-1.6 - Save</b></summary>

**What it does:** Creates the engine-data directory if needed, saves the aircraft XML at the module's own tool level and calls each strategy's `save()`.

**Implemented by:** `PropulsionDesign::save()` and `Rubber::save()`.

**Why it is needed:** Saving the selected engine data in the project makes the models available for later runs.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign::save()</code></summary>

**File:** `propulsion_design.cpp`

Creates the engine-data directory if missing, saves the aircraft XML with `ownToolLevel`, and calls each strategy's `save()`.

</details>

<details>
<summary><code>Rubber::save()</code></summary>

Copies newly used engine data into the project engine directory.

</details>

</details>
</details>

<details id="fr-1-7">
<summary><b>FR-1.7 - Fatal-error handling</b></summary>

**What it does:** Lifecycle errors are reported and cause remaining stages to be skipped; execution returns `EXIT_FAILURE`. Construction and entry-point errors are also caught or reported and return a failure status where control permits.

**Implemented by:** `Module::execute()` and `main()`.

**Why it is needed:** A failed run must be distinguishable from a successful run and provide an error message.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>Module::execute()</code> (inherited framework function)</summary>

**File:** `libs/moduleBasics/include/moduleBasics/module.h`

Runs the lifecycle `initialize` -> `run` -> `update` -> `report` -> `save`. It catches exceptions from lifecycle stages, writes the error to runtime information, skips remaining stages and returns `EXIT_FAILURE`; otherwise it returns `EXIT_SUCCESS`.

</details>

<details>
<summary><code>main()</code></summary>

**File:** `main.cpp`

Constructs `PropulsionDesign`, calls `Module::execute()` and returns its result. It catches exceptions that escape construction or execution, prints an error and returns `EXIT_FAILURE`.

</details>

</details>
</details>

<details id="fr-1-8">
<summary><b>FR-1.8 - Status and diagnostic messages</b></summary>

**What it does:** Writes messages through `utility::print()` at Out, Debug, Info, Warning or Error level. Console and log verbosity are controlled by `console_output` and `log_file_output`.

**Implemented by:** `utility::print()` and `main()`.

**Why it is needed:** Users need progress information and diagnostic detail to understand the run and identify problems.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>utility::print()</code></summary>

Routes messages by severity to the configured runtime-info console and log streams. If runtime information is unavailable, it emits no message.

</details>

</details>
</details>

<details id="fr-1-9">
<summary><b>FR-1.9 - Alternative entry point</b></summary>

**What it does:** Provides a constructor that accepts the tool name, version and runtime-configuration XML path, allowing creation without command-line arguments.

**Implemented by:** `PropulsionDesign` constructors.

**Why it is needed:** Allows another program or a test harness to create the module without using the command-line entry point.

<details>
<summary><b>Software requirements</b></summary>

<details>
<summary><code>PropulsionDesign constructors</code></summary>

**File:** `propulsion_design.h`

The command-line constructor is used by `main()`. The alternative constructor accepts the tool name, version and runtime-configuration XML path.

</details>

</details>
</details>

</details>

FR-12 and FR-13 describe engine-library dependencies used by this module. FR-14 summarizes the supported-configuration boundary.

---
<details id="fr-2">
<summary><b>FR-2 — Input acquisition and propulsor definition</b></summary>

**Statement.** The module shall read the aircraft geometry, the propulsor specification, the thrust requirement, the offtake requirements and the design flight condition from the aircraft exchange XML, and turn them into one typed propulsor object per specified propulsor.
**Src:** `propulsion_design.cpp` (`create_aircraft_geometry`, `create_propulsors`, `get_design_condition`, `sort_propulsors`), `utility.cpp`




<details>
<summary><b>Software requirements</b> (shared function descriptions for FR-2)</summary>

<details>
<summary><code>PropulsionDesign::create_aircraft_geometry()</code></summary>

**File:** `propulsion_design.cpp`

Reads wing / fuselage / empennage surfaces from the aircraft XML and builds them with `WingFactory`, `FuselageFactory`; adds each component's `position` as origin offset. **If geometry is missing:** warning and `aircraft_geometry = nullptr`.

</details>

<details>
<summary><code>PropulsionDesign::create_propulsors()</code></summary>

**File:** `propulsion_design.cpp`

Computes $T_{tot}$ (Eq. 1) from MTOM and T/W; reads average bleed/power demand (default 0 with warning); builds the energy-carrier map; for each `propulsor` node calls `utility::create_engine`.

</details>

<details>
<summary><code>PropulsionDesign::get_design_condition()</code></summary>

**File:** `propulsion_design.cpp`

Reads cruise Mach, altitude, ΔISA; builds the atmosphere with sea-level temperature $T_0+\Delta ISA$ (Eq. 3). Returns `{atmosphere, altitude, mach}`.

</details>

<details>
<summary><code>Propulsion::swap() / move constructor / move assignment</code></summary>

**File:** `propulsion.h`

Exchanges the members of two propulsion objects. The move constructor and move assignment are implemented through `swap()`, so every `std::swap` of two engines in `sort_propulsors()` and in `update()` goes through it. `engine_geom_` is not exchanged (⚠ O-24).

</details>

<details>
<summary><code>PropulsionDesign::sort_propulsors()</code></summary>

**File:** `propulsion_design.cpp`

If more than two engines have parent `Wing`: reorders them (left-lateral first, then by required thrust) with in-place swaps; stores the permutation in `swapped_order`.

</details>

<details>
<summary><code>utility::create_engine()</code></summary>

**File:** `utility.cpp`

Combines `powertrain`+`type` text to select `Turbofan`, `Turboprop` or `Openrotorfan`; resolves the carrier by ID; $T_i=s_i T_{tot}$, offtakes $=s_i\cdot$total (Eq. 2). **Throws** on unknown carrier ID, unsupported carrier for the type, or unsupported powertrain.

</details>

<details>
<summary><code>utility::get_parent_component()</code></summary>

**File:** `utility.cpp`

Parses `parent_component`, `y`, `x`, `z` tags into `(Parent, Lateral, Longitudinal, Vertical)`. **Throws** on unknown text.

</details>

<details>
<summary><code>utility::create_energy_carrier_map(), utility::to_energy_carrier()</code></summary>

**File:** `utility.cpp`

`to_energy_carrier` looks the exact fuel id up (case-insensitive) in `energy_carrier.xml` via `families()`, takes its family (`Kerosene` / `LiquidHydrogen`) and returns the `EnergyCarrierFamily` enum; unknown ids or families throw. `create_energy_carrier_map` applies it to every `energy_carrier@ID` node.

</details>

<details>
<summary><code>operator*(double, Offtakes), operator+(Offtakes, Offtakes)</code></summary>

**File:** `utility.cpp`

Component-wise scaling (`operator*`, used by `create_engine`) and addition (`operator+`, not called in `src/`) of bleed air and shaft power.

</details>

<details>
<summary><code>utility::print()</code></summary>

**File:** `utility.cpp`

Routes a message to the runtime-info stream for level Out / Debug / Info / Warning / Error; does nothing if no runtime info exists.

</details>

</details>

<details id="fr-2-1">
<summary><b>FR-2.1</b> — Aircraft geometry import</summary>

**What it does:** Reads all wing, fuselage and empennage surfaces from `component_design/{wing,fuselage,empennage}/specific/geometry/…`. Builds them with the aircraftGeometry2 factories. Shifts each component origin by its `position` node into the global frame. All lookups are in one `try` block. If a required lookup (wing, fuselage or empennage, including their `position` nodes) throws a `std::string` exception, as `getVector` does when nodes are missing, a warning is printed and the **whole** geometry is set to `nullptr`, even if the other components exist; the module then continues in "no-geometry" mode (placement falls back to the origin, FR-6.6; no pylon, FR-7.1). This fallback does not cover plotting: with `plot_output/enable` = true, `plot::top_overview()` still dereferences the null geometry (⚠ O-22).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::create_aircraft_geometry()`

</details>

**Why it is needed:** Placement, pylon and plots need the geometry of wing, fuselage and tail, and reading it from the aircraft file keeps the engines consistent with the airframe. A defined fallback exists for the case that no geometry is available yet (FR-6.6, FR-7.1).

</details>

<details id="fr-2-2">
<summary><b>FR-2.2</b> — Propulsor creation</summary>

**What it does:** For each `design_specification/propulsion/propulsor` node: reads `powertrain` + `type` (concatenated, for example `turbo`+`fan`), `energy_carrier_ID`, `thrust_share`, and `position/{parent_component, x, y, z}`. Instantiates `Turbofan`, `Turboprop` or `Openrotorfan` for the matching energy carrier. Unsupported combinations throw `std::runtime_error`.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::create_propulsors()`, `utility::create_engine()`

</details>

**Why it is needed:** The aircraft file describes the propulsors (type, fuel, thrust share, position); the module needs them as typed objects to design each one. Unknown combinations must be rejected.

</details>

<details id="fr-2-3">
<summary><b>FR-2.3</b> — Position-tag parsing</summary>

**What it does:** Maps text tags to enums: parent ∈ {wing, wing_body, fuselage, empennage}; lateral ∈ {left, right, mid}; longitudinal ∈ {front, rear}; vertical ∈ {under, mid, over, in}. Any other text throws.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `utility::get_parent_component()`

</details>

**Why it is needed:** Placement and pylon rules depend on where an engine sits (parent, side, front or rear, under or over), so the position text has to be converted to defined values and invalid text rejected.

</details>

<details id="fr-2-4">
<summary><b>FR-2.4</b> — Propulsor ordering</summary>

**What it does:** Only when more than two propulsors have parent `Parent::Wing`, the list is re-ordered in place with swaps. Step 1 moves every propulsor with lateral position `Left` to the front (the test looks only at the lateral tag, for all propulsors, not only the wing-mounted ones). Step 2 is intended to order each side by required thrust, largest first, so that the largest engine is processed first and therefore becomes the inner engine of its side (FR-6.7). The permutation is stored in `swapped_order`, and `update()` is meant to undo it. **Verified by simulation:** the algorithm was ported line by line to Python, with both `std::swap` operands bound before swapping as in C++. This is a port, not a run of the C++ code. Exhaustive check of all 144 four-engine cases (6 left/right arrangements × 24 distinct thrust rankings): left-first grouping in 120/144 (83.3 %), each side in descending thrust order in 120/144 (83.3 %), original order restored by `update()` in 124/144 (86.1 %). With equal thrust shares, which is the usual case, left engines always come first, and all 6 four-engine arrangements are restored; for six equal-thrust engines (3 left, 3 right), 17 of 20 arrangements are restored. The intended order and the restoration are therefore **not guaranteed** for unequal thrust shares or more engines (⚠ O-21). The engines keep their IDs, so the exported `propulsion@<ID>` nodes are not mixed up, but their order in the XML and in the report can differ from the input order.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::sort_propulsors()`, `PropulsionDesign::update()`, `Propulsion::swap()` (via move constructor / move assignment)

</details>

**Why it is needed:** Inner and outer wing engines are recognised by the order in which they are placed, so the engines need a defined processing order.

</details>

<details id="fr-2-5">
<summary><b>FR-2.5</b> — Energy-carrier map</summary>

**What it does:** Reads each `design_specification/energy_carriers/energy_carrier@ID` as the numeric carrier ID (the key later referenced by `propulsor/energy_carrier_ID`) and reads `energy_carrier/value` as the exact fuel identifier, case-insensitively. The fuel identifier is looked up in the shared database `energy_carrier.xml` through `families()` of `libraries/energyCarriers`. The entry's `family` attribute (`Kerosene` or `LiquidHydrogen`) selects the propulsion template (`EnergyCarrierFamily::Kerosene` or `::Liquid_Hydrogen`). Currently recognised identifiers: `kerosene`, `liquid_hydrogen`, `liquid_hydrogen_green` and `SAF-HEFA-SPK` (family Kerosene, so it is sized like a kerosene engine; the engine library's optional lower-heating-value rescaling of the fuel flow is not used by this module, which matters for SAF because its LHV differs from kerosene, ⚠ O-19). An identifier that is not in the database throws "The energy carrier '…' is not supported.", a family other than the two above throws, and an unknown carrier ID in a propulsor throws. **Runtime dependency:** `energy_carrier.xml` is located by `find_energy_carrier_database()` in `libs/energyCarriers`, relative to the process **working directory**. It checks `<dir>/databases/general_data/energy_carrier.xml`, starting with the current directory and then moving to the parent directory, for at most six directory levels in total (the current directory plus five parents). If none exists it falls back to `../databases/general_data/energy_carrier.xml`. Starting the executable from the wrong directory therefore makes the lookup fail (this caused the earlier lower test result). A copy of the file is kept in the repository under `libs/general_data/`.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `utility::create_energy_carrier_map() / to_energy_carrier()`, `families()` (energyCarriers library)

</details>

**Why it is needed:** The shared database maps fuel identifiers to the supported energy-carrier families (kerosene and liquid hydrogen), which avoids a separate code path for each identifier within a family.

</details>

<details id="fr-2-6">
<summary><b>FR-2.6</b> — Design flight condition</summary>

**What it does:** Reads `design_mission/{initial_cruise_mach_number, initial_cruise_altitude, delta_ISA}`. Builds the atmosphere object with sea-level temperature $T_0+\Delta ISA$ and pressure $p_0$ (Eq. 3).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::get_design_condition()`

</details>

**Why it is needed:** The bucket point (a local low-TSFC operating point) is only meaningful at the flight condition the aircraft is designed for, so the design Mach number, altitude and temperature deviation must be known.

</details>

<details id="fr-2-7">
<summary><b>FR-2.7</b> — Offtake requirement</summary>

**What it does:** Reads `component_design/systems/specific/average_bleed_air_demand` and `average_power_demand`. If either is missing, zero offtakes are used and a warning is printed.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::create_propulsors()`

</details>

**Why it is needed:** Bleed air taken from the engines reduces their thrust and shaft power increases their fuel flow (FR-4.6), so the engines can only be sized and evaluated correctly if the demand is known.

</details>

<details id="fr-2-8">
<summary><b>FR-2.8</b> — Thrust and offtake distribution</summary>

**What it does:** Computes the total required thrust (Eq. 1), then each engine's thrust and offtakes by its thrust share (Eq. 2). The individual shares are not range-checked (⚠ O-15).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::create_propulsors()`, `utility::create_engine()`, `operator*(double, Offtakes)`

</details>

**Why it is needed:** The thrust of the whole aircraft has to be split over the individual engines (and the offtakes with it), because each engine is sized for its own share.

</details>


**Equations**

$$T_{tot} = g \, m_{MTO} \, (T/W) \tag{1}$$

$$T_i = s_i\,T_{tot},\qquad \dot m_{b,i}=s_i\,\dot m_{b},\qquad P_{sh,i}=s_i\,P_{sh} \tag{2}$$

$$T_{atm}(h=0)=T_0+\Delta ISA,\qquad p(h=0)=p_0 \tag{3}$$

Offtakes are split by thrust share only. The code marks this as a `@todo` for other distribution schemes.

**Inputs read from the aircraft XML**

| Quantity | XML path (under `aircraft_exchange_file/`) |
|---|---|
| $m_{MTO}$ | `analysis/masses_cg_inertia/maximum_takeoff_mass/mass_properties/mass` |
| $T/W$ | `sizing_point/thrust_to_weight` |
| Mach, altitude, ΔISA | `requirements_and_specifications/requirements/top_level_aircraft_requirements/design_mission/…` |
| Propulsors | `requirements_and_specifications/design_specification/propulsion/propulsor` |
| Energy carriers | `requirements_and_specifications/design_specification/energy_carriers` |
| Offtakes | `component_design/systems/specific/average_{bleed_air_demand, power_demand}` |
| Geometry | `component_design/{wing, fuselage, empennage}/…` |

</details>

<details id="fr-3">
<summary><b>FR-3 — Design-consistency validation</b></summary>

**Statement.** The module shall check its propulsor set, both after setup and after the design loop, and shall abort with a named error if the sizing point or the take-off mass is missing or the total thrust does not match the requirement. The lateral thrust-symmetry check exists in the code but is currently inactive (FR-3.4, ⚠ O-25).
**Src:** `PropulsionDesign::check_validity()`




<details>
<summary><b>Software requirements</b> (shared function descriptions for FR-3)</summary>

<details>
<summary><code>PropulsionDesign::check_validity()</code></summary>

**File:** `propulsion_design.cpp`

Re-reads MTOM and T/W, recomputes $T_{tot}$; sums $T_i$ and, per engine, the thrust moment $\vec r_i\times(T_i,0,0)$. **Throws** if $T/W\le0$, $m_{MTO}\le0$, or Eq. 4 is violated ($\ge10$ N). The symmetry condition of Eq. 5 tests $\lvert M_x\rvert\ge10$ N·m, and $M_x$ is always 0, so it never throws (⚠ O-25). Called after initialization and after the design loop.

</details>

</details>

<details id="fr-3-1">
<summary><b>FR-3.1</b> — Sizing point present</summary>

**Condition that triggers the error:** $T/W \le 0$

**Error message:** "No design thrust given. Get a sizing point."

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::check_validity()`

</details>

**Why it is needed:** Without a thrust-to-weight ratio the required thrust cannot be computed, so the module must stop instead of designing engines for zero thrust.

</details>

<details id="fr-3-2">
<summary><b>FR-3.2</b> — MTOM present</summary>

**Condition that triggers the error:** $m_{MTO} \le 0$

**Error message:** "No MTOM given. Get a MTOM."

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::check_validity()`

</details>

**Why it is needed:** Without a take-off mass the required thrust cannot be computed.

</details>

<details id="fr-3-3">
<summary><b>FR-3.3</b> — Thrust balance</summary>

**Condition that triggers the error:** $\left\lvert\sum_i T_i - T_{tot}\right\rvert \ge 10\ \text{N}$. Only the sum is checked, so negative shares or shares above 1 can cancel and pass (⚠ O-15).

**Error message:** "Total thrust share of engines is not equal to one."

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::check_validity()`

</details>

**Why it is needed:** This check detects a significant mismatch between the total thrust of the engines and the required total thrust.

</details>

<details id="fr-3-4">
<summary><b>FR-3.4</b> — Lateral thrust symmetry</summary>

**Condition that triggers the error:** $\lvert M_x\rvert \ge 10\ \text{N·m}$, where the code computes the moment of the thrust about the origin as $\vec M=\vec r\times(T,0,0)=(0,\;zT,\;-yT)$ and tests only the $x$ component, which is identically zero. **Since commit `dc80519b` this check therefore never fires (⚠ O-25).**

**Error message:** "Non-symmetrical thrust about y-axis. Moment: <M_y>" (prints the $y$ component, but the condition uses $M_x$).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::check_validity()`

</details>

**Why it is needed:** The check is intended to detect a significant lateral thrust imbalance, which would produce a yawing moment; in the current code it is inactive (⚠ O-25).

</details>


$$\Big|\sum_i T_i - g\,m_{MTO}\,(T/W)\Big| < 10\ \text{N} \tag{4}$$

$$\vec M=\sum_i \vec r_i\times(T_i,0,0)=\Big(0,\;\sum_i z_iT_i,\;-\sum_i y_iT_i\Big),\qquad \text{error if } |M_x|\ge 10\ \text{N·m} \tag{5}$$

$y_i$ and $z_i$ are the lateral and vertical coordinates of engine $i$. Because the thrust is assumed along $+x$, $M_x$ is zero by construction, so the condition of Eq. 5 can never be met: the lateral symmetry check is inactive since commit `dc80519b` (⚠ O-25). The yawing moment that the previous version checked ($\sum_i T_i y_i$) is $-M_z$. FR-3 runs twice: once at the end of initialization, and once after the design loop.

</details>

### 5.1 Equations

**Model selection** (when no model is preselected):

$$\text{model}^{*}=\arg\min_{m\in\text{database}}\;\big|\,SLST_m - T_i\,\big| \tag{6}$$

**Scale factor**

$$k=\begin{cases}T_i/T_{ref} & T_i>0\\ 1 & T_i\le 0\end{cases},\qquad T_{ref}=F_{unscaled}(N1_{max},\ h=0,\ M=0,\ \text{takeoff},\ \dot m_b=0,\ P_{sh}=0) \tag{7}$$

$T_{ref}$ is evaluated with the design atmosphere object (sea-level temperature $T_0+\Delta ISA$). In the engine library the atmosphere only enters the correction factors for mass flow, speed and temperature; thrust is $F=k\,F_{deck}\,(1-2\dot m_b/\dot m_{core})$, and with $\dot m_b=0$ the atmosphere has no effect on it. $k$ is therefore a ratio of deck thrusts at the take-off rating at sea level and Mach 0, independent of $\Delta ISA$.

**Dimension scaling [Ray12]** (the same relations are implemented in `Engine::get_engine_dimensions()` in the engine library):

$$h=h_0\,k^{0.5},\qquad w=w_0\,k^{0.5},\qquad D_{fan}=D_0\,k^{0.5},\qquad L=L_0\,k^{0.4} \tag{8}$$

**Dry-mass scaling [Ray12]**

$$m_{eng}=f_m\;m_{dry,0}\;k^{1.1} \tag{9}$$

**Offtake-corrected thrust and fuel flow** (`Engine::calculate_offtake_correction`, bleed correction per Raymer p. 488, shaft correction per CF6 installation-manual fit):

$$F = k\;F_{deck}(N1,h,M)\,\Big(1-2\,\frac{\dot m_{b}}{\dot m_{core}}\Big) \tag{10}$$

$$\dot m_{core}=\frac{k\,W_{deck}(N1,h,M)}{W_{corr}},\qquad W_{corr}=\sqrt{\frac{T_{ISA}}{T}}\;\frac{p}{p_{ISA}} \tag{10a}$$

$$\dot w_f = k\;\dot w_{f,deck}(N1,h,M)\Big(1+\frac{P_{sh}\;c_{sh}}{F}\Big) \tag{11}$$

$$c_{sh}=(-3.5\!\times\!10^{-7}h+6.75\!\times\!10^{-3})M^{2}+(4.7\!\times\!10^{-7}h-1.208\!\times\!10^{-2})M+10^{-8}h+5.85\!\times\!10^{-3} \tag{12}$$

($h$ is the altitude in m.) The library also prints a message to the standard output when the relative bleed $1.06\,\dot m_b/\dot m_{core}$ exceeds the engine's allowed maximum, or when $P_{sh}$ exceeds the allowed maximum shaft offtake, which scales linearly with $k$.

**Bucket point.** The bucket point is the operating point of low TSFC (the "bucket" of the fuel-flow-versus-thrust curve). The search is a fixed-step scan that stops at the first TSFC increase, so it finds the first observed local minimum, **not necessarily the global minimum**:

$$TSFC(N1)=\frac{\dot w_f(N1)}{F(N1)},\qquad N1^{*}=\text{first local minimum of } TSFC(N1)\ \text{on the grid } N1_{idle}+j\,\Delta N1 \tag{13}$$

$$\text{BucketPoint}=\big(F(N1^{*}),\;TSFC(N1^{*})\big)$$

Algorithm (`Rubber::calculate_bucket_point`):
1. Load the engine at scale $k$.
2. Compute $N1_{min}$ from the "idle" rating and $N1_{max}$ from the "takeoff" rating at the design altitude and Mach number, with the engine's offtakes.
3. Start at $N1_{min}$ and step by $\Delta N1 = 0.01$ for at most $1/\Delta N1 = 100$ iterations.
4. Stop at the first step where TSFC rises (the first observed local minimum, not necessarily the global one), when $N1 > N1_{max}$, or at the iteration limit. The last two cases print a warning. The last accepted $N1$ is taken as $N1^{*}$. Note that the code accepts the new $N1$ (when TSFC did not rise) before it tests $N1 > N1_{max}$, so $N1^{*}$ can lie one step above $N1_{max}$.

**Efficiency technology factor.** With $\eta_{cfg}$ from the config file and $\eta_{xml}$ already stored in the engine XML, the module applies the ratio so that the factor is not applied twice:

$$\eta_{new}=2-\frac{2-\eta_{cfg}}{2-\eta_{xml}},\qquad \dot w_{f,deck}\leftarrow \dot w_{f,deck}\cdot(2-\eta_{new}) \quad(\text{entries} \ne -9999) \tag{14}$$

The engine XML is updated to $\eta_{cfg}$. $\eta>1$ means a lower fuel flow. If $\lvert\eta_{xml}-\eta_{cfg}\rvert\le10^{-6}$, nothing is changed.

**Open-rotor tip Mach number** (`Engine::get_tip_mach`):

$$M_{tip,rel}=\sqrt{\Big(\frac{\pi\,D_{fan}\;n_{N1}\;i_{gb}}{a}\Big)^{2}+M^{2}},\qquad n_{N1}=\frac{N1\cdot N1_{nom}}{60} \tag{15}$$

where $i_{gb}$ is the gearbox ratio and $a$ the speed of sound. A message is printed if $M_{tip,rel}>1.2$ (see FR-4.10).

</details>

<summary><b>FR-5.5</b> — Turbofan engine-geometry stub</summary>

**What it does:** A two-section cone ($0\to0.15\,D_{in}$ over $0.1L$) named `engine_<id>`, stored as the engine geometry (used by the plots).

<details>
<summary><b>Software requirements</b></summary>

<details id="fr-5-6">
<summary><b>FR-5.6</b> — Open-rotor nacelle</summary>

**What it does:** A 12-section surface (hub body plus two thin full-diameter discs representing the two rotors) with the pattern in Table 5.2. The engine-geometry stub is a single section of scale 0.3.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `nacelle::Default::operator()(Openrotorfan) / openrotor_method`

</details>

**Why it is needed:** An open-rotor engine looks different from a ducted fan (hub with two rotor planes), so it needs its own nacelle shape.

</details>


**Equations**

Default contour (unit circle, 40 points, step 9°):

$$x_j=0.5\cos\theta_j,\quad y_j=0.5\sin\theta_j,\quad \theta_j=9^\circ j,\; j=0\ldots39 \tag{16}$$

$$D_{in}=\max\{w,\;h,\;D_{fan}\} \tag{17}$$

Section diameter along the nacelle axis $x_a$ (turbofan), linear between sections:

$$D_{nac}(x_a):\quad D(0)=D_{in},\;D(0.25L)=1.21\,D_{in},\;D(0.75L)=1.21\,D_{in},\;D(L)=D_{in} \tag{18}$$

The 1.21 factor is cited from [Ata10] p. 45. The section offsets in the code are relative to the previous section (0, +0.25L, +0.5L, +0.25L), which gives the absolute positions above.

**Table 5.1 – Turbofan nacelle sections**

| Section | Axial position | Scale (× $D_{in}$) |
|---|---|---|
| 0 | 0 | 1.00 |
| 1 | 0.25 L | 1.21 |
| 2 | 0.75 L | 1.21 |
| 3 | 1.00 L | 1.00 |

**Table 5.2 – Open-rotor nacelle sections** (the code has no comment on what the sections represent; the interpretation is consistent with the engine type `CROR`, a contra-rotating open rotor with two rotor planes, with the engine data, where the "diameter" used for $D_{in}$ is the propeller diameter 3.25 m, and with the commit "Modification of CROR nacelle", but it is an interpretation)

| Section | Axial position | Scale | Likely meaning |
|---|---|---|---|
| 1 | 0 | 0.001 | Spinner tip |
| 2 | 0.01 L | 0.3 | Spinner |
| 3 | 0.31 L | 0.4 | Hub body |
| 4 | 0.61 L | 0.4 | Hub body |
| 5 | 0.61 L | 1.0 | Rotor 1 disc (start) |
| 6 | 0.62 L | 1.0 | Rotor 1 disc (end) |
| 7 | 0.62 L | 0.4 | Hub body |
| 8 | 0.77 L | 0.4 | Hub body |
| 9 | 0.77 L | 1.0 | Rotor 2 disc (start) |
| 10 | 0.78 L | 1.0 | Rotor 2 disc (end) |
| 11 | 0.78 L | 0.3 | Aft body |
| 12 | 0.88 L | 0.2 | Tail cone |

</details>

<details id="fr-6-1">
<summary><b>FR-6.1</b> — Support check</summary>

**What it does:** The (parent, lateral, longitudinal, vertical) tuple must be in the supported set for the engine type (Tables 7.1 and 7.2). Otherwise throw "The parent component or location of the engine is not supported."

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integration::Default::turbofan_method()`, `integration::Default::openrotorfan_method()`

</details>

**Why it is needed:** Placement rules exist only for certain positions; any other position must be rejected instead of guessed.

</details>

<details id="fr-6-2">
<summary><b>FR-6.2</b> — Geometry selection</summary>

**What it does:** Each placement selects only the geometry it needs. The fuselage is needed by all four placements (wing, fuselage, empennage, wing-body) and must be unique (otherwise throw). The vertical tail is needed only for empennage-mounted engines: it is the first vertical empennage surface (otherwise throw). The wing is needed for wing and wing-body placements: with several wings, the wing named in `name_wing_engines` is used; if not found, the first wing is used with a warning.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integration::Default::select_wing() / select_fuselage() / select_vertical_tail()`, `geometry::is_vertical()`

</details>

**Why it is needed:** Each placement formula needs particular parts of the airframe (the fuselage always, the wing that carries the engines for wing and wing-body engines, the vertical tail for tail-mounted engines); unclear geometry must give an error or a warning.

</details>

<details id="fr-6-3">
<summary><b>FR-6.3</b> — Wing-mounted placement</summary>

**What it does:** See §7.1. Wing must be extruded along ±Y, or throw.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integrate_into_wing() (turbofan)`, `calculate_span_position()`, `integrate_under_wing() / integrate_over_wing() / integrate_into_wing() (open-rotor)`, `calculate_span_position_openrotor()`

</details>

**Why it is needed:** Wing-mounted engines are the most common layout, and their position follows established rules for span, chord and height.

</details>

<details id="fr-6-4">
<summary><b>FR-6.4</b> — Fuselage-mounted placement</summary>

**What it does:** See §7.2. Exactly two fuselage engines, one per side.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integrate_into_fuselage() (turbofan)`, `integrate_into_fuselage() / integrate_into_fuselage_top() (open-rotor)`

</details>

**Why it is needed:** Rear-fuselage engines are a second standard layout and need their own rules.

</details>

<details id="fr-6-5">
<summary><b>FR-6.5</b> — Empennage / wing-body placement</summary>

**What it does:** See §7.3 and §7.4.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integrate_into_empennage() (turbofan)`, `integrate_into_wing_body()`, `integrate_into_empennage() (open-rotor)`, `geometry::is_vertical()`

</details>

**Why it is needed:** Tail-mounted and wing-body engines are further layouts that need their own rules and clearance checks.

</details>

<details id="fr-6-6">
<summary><b>FR-6.6</b> — No-geometry fallback</summary>

**What it does:** If no aircraft geometry exists, the engine is placed at the origin.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `guess_position()`

</details>

**Why it is needed:** The fallback allows placement to continue with a defined position (the origin) when airframe geometry is not yet available.

</details>

<details id="fr-6-7">
<summary><b>FR-6.7</b> — Space bookkeeping</summary>

**What it does:** For wing-mounted engines (`Parent::Wing`: turbofans and open-rotor in-wing engines), the engine's "slot" on its side is `slot = engines_done.wing mod (N_w/2)`; slot 0 is the inner engine, slot 1 the outer engine. The slot therefore alternates with the processing order of all wing-mounted engines, not per side, so correct inner/outer pairs rely on the processing order of FR-2.4 (⚠ O-21). `max_slots_per_side()` gives 1 for $N_w=2$ and 2 for $N_w=4$ and throws "Unsupported number of wing-mounted engines." otherwise; the "No space on the wing" check `slot >= max_slots_per_side()` cannot be reached with these values. The open-rotor under- and over-wing placements still use the older rule (a second engine on the same parent tuple is the outer engine). Wing-body engines (`Parent::WingBody`) always get slot 0, so both wing-body engines use the shift entry with `id` 0. Fuselage and empennage placements still reject a second engine on an already used parent tuple.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `slot_index_on_side()`, `max_slots_per_side()`, `max_shift_ids()`, `integrate_into_wing() (turbofan)`, `integration::Default::turbofan_method()`, `integration::Default::openrotorfan_method()`

</details>

**Why it is needed:** The module tracks which positions are occupied so that supported multi-engine layouts can assign distinct locations (inner and outer engine), and rejects some over-capacity cases; not every unsupported engine count is rejected (⚠ O-6).

</details>

<details id="fr-6-8">
<summary><b>FR-6.8</b> — User position shift</summary>

**What it does:** Since commit `dc80519b`, each engine slot can have its own shift, defined in `repositioning/engine_shifts/engine` entries (`id`, `shift_x`, `shift_y`, `shift_z`) for one side of the aircraft; the other side is mirrored. The entries are validated when the integrator is constructed (§7.5). For each engine the shift entry is looked up (by its slot on the side for wing, wing-body and open-rotor wing and fuselage engines, by its engine ID for turbofan fuselage and empennage engines; open-rotor empennage engines get no shift) and added in the frame in which the position is computed, after mirroring for left engines (Eq. 26). See §7.5 and ⚠ O-26, O-27.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `validate_user_shift_configuration()`, `get_user_shift()`, `calculate_user_shift()`, `slot_index_on_side()`, `max_shift_ids()`, `integrate_into_wing() (turbofan)`, `integrate_into_fuselage() (turbofan)`, `integrate_into_empennage() (turbofan)`, `integrate_into_wing_body()`, `integrate_under_wing() / integrate_over_wing() / integrate_into_wing() (open-rotor)`, `integrate_into_fuselage() / integrate_into_fuselage_top() (open-rotor)`

</details>

**Why it is needed:** The automatic position is a rule of thumb; the user needs a way to move individual engines without changing the code.

</details>

<details id="fr-6-9">
<summary><b>FR-6.9</b> — Global-frame output</summary>

**What it does:** Converts the result from the component-local frame to the global frame and stores it as the engine position.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `integrate_into_* (all placement functions)`

</details>

**Why it is needed:** Other modules use the global aircraft coordinate system, so the position must be given in it.

</details>

<details id="fr-6-10">
<summary><b>FR-6.10</b> — Engine at wing kink (optional)</summary>

**What it does:** If `program_settings/engine_at_kink` is true, wing-mounted turbofans are placed at the wing kink span station instead of the default span position, when a kink exists and the engine fits there. Details in §7.7.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `find_kink_span_position()`, `integrate_into_wing() (turbofan)`, `integrate_into_wing_body()`

</details>

**Why it is needed:** This option allows a wing-kink installation to be evaluated. A possible structural benefit (no additional local reinforcement outside the existing kink rib, as the configuration description states) motivates the choice; the module does not calculate that benefit.

</details>


**Table 7.1 – Supported placements, turbofan**

| Parent | Lateral | Long. | Vertical |
|---|---|---|---|
| Wing | left, right | front | under, over |
| Fuselage | left, right | rear | mid |
| Empennage | mid | front | in |
| Wing-body | left, right | rear | over |

**Table 7.2 – Supported placements, open-rotor** (adds `Wing/in` and `Fuselage/over`)

| Parent | Lateral | Long. | Vertical |
|---|---|---|---|
| Wing | left, right | front | under, in, over |
| Fuselage | left, right | rear | mid, over |
| Empennage | mid | front | in |

Coordinate frames used below: wing-local = (X chord, Y height, Z span), fuselage-local = (X width, Y height, Z length). $x_{LE}(z)$ is the leading-edge point at span station $z$, $y_{c/4}$ is the height of the quarter-chord point at that station, $h_{nac}$ is the maximum nacelle height, $w_{nac}$ the maximum nacelle width.

### 7.1 Wing-mounted turbofan (FR-6.3)

Let $N_w$ be the total number of wing-mounted propulsors in the aircraft (`Parent::Wing` plus `Parent::WingBody`). Only $N_w=2$ (one per semi-span) and $N_w=4$ (two per semi-span) are supported. For other values `max_slots_per_side()` throws "Unsupported number of wing-mounted engines." (see FR-6.7). Define $D_{max}=1.21\,D_{fan}$.

**Spanwise position** ($z_e$, absolute value; the sign follows the wing extrusion direction):

$$z_e=\begin{cases}0.95\left(\dfrac{w_f}{2}+1.3\,D_{max}+0.5\,D_{max}\right) & N_w=2 \;[\text{Ata10 p.52}]\\[3mm] 0.64\,\dfrac{b}{2} & N_w=4,\ \text{outer} \;[\text{Ata10 p.83}]\\[3mm] \dfrac{0.9}{4}\left(0.64\,b+w_f-D_{max}\right) & N_w=4,\ \text{inner} \;[\text{Ata10 p.94}]\end{cases} \tag{19}$$

**Chordwise position** (current implementation; $L$ is the engine length; under the wing [Ata10] p. 48f, over the wing [Ata10] p. 55):

$$x_e=\begin{cases} x_{LE}(z_e)+0.10\,c(z_e)-0.9\,L & \text{under the wing}\\ x_{LE}(z_e)+0.75\,c(z_e) & \text{over the wing}\end{cases} \tag{20}$$

Under the wing, the inlet sits 0.15 chords ahead of the local quarter-chord point and the engine reference point trails the inlet by $0.9L$. Earlier versions used $x_{LE}-0.9\,c$, which is no longer implemented.

**Vertical position**

$$y_e=\begin{cases} y_{c/4}-0.5\,h_{nac}-0.1\,c(z_e) & \text{under the wing}\\ y_{c/4}+0.8\,h_{nac} & \text{over the wing}\end{cases} \tag{21}$$

The over-wing factor 0.8 is the gap $h_o/D_{max}=0.3$ of [Ata10] p. 51 plus half the nacelle height (engine-centre convention), $0.3+0.5$.

For a left-side engine the span coordinate is mirrored ($z_e\to -z_e$) and the lateral shift component negated ($s_z\to -s_z$) **before** the user shift is applied (Eq. 26).

### 7.2 Fuselage-mounted turbofan (FR-6.4)

Only $N_{fus}=2$ is supported. With $\sigma=\pm1$ the extrusion direction of the fuselage:

$$z_e=\sigma\,0.8\,L_f,\qquad y_e=0.25\,h_f(z_e),\qquad x_e=\tfrac12\,w_f(z_e)+1.25\cdot\tfrac12\,w_{nac} \tag{22}$$

Since commit `dc80519b` a left engine is mirrored in the fuselage-local $Z$ coordinate (length), $z_e\to -z_e$, instead of $X$ (width) as before. Both fuselage engines therefore end up on the same side of the fuselage, the left one at the mirrored length station (⚠ O-28). The user shift is applied with the engine ID as slot index (§7.5).

### 7.3 Empennage-mounted turbofan (FR-6.5)

Requires the fuselage and the vertical tail to be aligned in Y (tolerance $10^{-4}$ m), otherwise throw. With $p_{25}$ the quarter-chord point at the MAC of the vertical tail (global):

$$x_e = x_{p25} - 0.25\,L,\qquad y_e = y_{fus},\qquad z_e = \tfrac12\,h_f(z_{p25}) + 1.25\cdot\tfrac12\,w \tag{23}$$

($L$ and $w$ are the engine length and width.) The user shift is added to this global position with the engine ID as slot index (§7.5).

### 7.4 Wing-body (over the wing, rear) turbofan (FR-6.5)

1. **Exclusion zones.** For each **non-vertical** empennage surface with more than one section, let $\Delta=\lvert y_{front}-y_{back}\rvert$, $y_{root}=\min(\lvert y_{front}\rvert,\lvert y_{back}\rvert)$ and $y_{tip}=\max(\lvert y_{front}\rvert,\lvert y_{back}\rvert)$. The surface blocks the symmetric intervals $\pm[\,\max(0,\,y_{root}-0.25\Delta),\; y_{tip}+0.25\Delta\,]$ (four boundaries). The list also contains $-b/2$ and $+b/2$ and is sorted. (Changed in `dc80519b`; before, vertical surfaces were included and one interval $[y_{back}-0.25\Delta,\,y_{back}+1.25\Delta]$ was used.)
2. **Boundary-mean check (removed).** The earlier check that the mean of all boundaries is below 1 m was removed in `dc80519b`; the boundaries are now symmetric by construction.
3. **One wing-body engine** ($N_w=1$; with the shipped configuration the integrator constructor now throws before this point, ⚠ O-30): placed at span 0 if the engine envelope ($\pm D_{max}/2$) fits between the two central boundaries, otherwise throw "Empennage-engine collision…":
$$x_e = x_{LE}(0)+0.70\,c(0),\qquad y_e=y_{LE}(0)+0.8\,h_{nac} \tag{24}$$
4. **Two wing-body engines** ($N_w=2$): span position
$$z_e=\begin{cases}0.80\,D_{max} & \text{central gap}\ge 3.4\,D_{max}\\ 0.75\,D_{max}+\lvert\text{boundary}_{2a-1}\rvert & \text{otherwise, with } a=\text{number of gaps}\ge1.5\,D_{max}\end{cases} \tag{25}$$
and $x_e = x_{LE}+0.70\,c$, $y_e=y_{LE}+0.8\,h_{nac}$ (the same 0.8 as for the one-engine case; earlier versions used 0.7 and 1.0). Since `dc80519b` the code both negates the span coordinate for the second engine processed (`engines_done.wing > 0`) and mirrors the span coordinate of every left engine. The two flips cancel for one of the engines, so both wing-body engines end up on the same side (⚠ O-29). If no gap qualifies, throw "No available space…". Other values of $N_w$ fall through the `switch` without placing the engine and without an error (⚠ O-6).

### 7.5 User position shift (FR-6.8)

Since commit `dc80519b` the shift is defined per engine slot in the configuration:

```
repositioning/engine_shifts/engine  (repeated)
    id/value       slot number on one side (0 = inner, 1 = outer)
    shift_x/value  [m]   config description: aft shift along the fuselage
    shift_y/value  [m]   config description: vertical position
    shift_z/value  [m]   config description: lateral shift along the wing
```

**Validation** (`validate_user_shift_configuration()`, called in the integrator constructor): every `id` must be numeric, smaller than `max_shift_ids()`, and unique, and there must not be more entries than `max_shift_ids()`; otherwise `std::runtime_error`. The intended fallback for a configuration without entries is zero shifts (`get_user_shift()` and the validator both handle this case). It is currently blocked: the integrator's members `usershift_x/y/z` are initialised from the removed paths `repositioning/shift_{x,y,z}/value` before the validator runs, and without any `engine_shifts` entry these lookups have nothing to resolve to, so construction can fail (⚠ O-27). If `max_shift_ids()` is 0 (for example one wing-body engine, $N_w=1$, or no counted engines), the default entry `id` 0 is already out of range and the integrator constructor throws; the message then prints the allowed range as "0 to 18446744073709551615" (unsigned underflow) (⚠ O-30). `max_shift_ids()` is $N_w/2$ if there are wing-mounted engines, else $N_{fus}/2$, else $N_{emp}$; so with engines on both wing and fuselage, the allowed range follows the wing count.

**Lookup** (`get_user_shift(slot)`): the slot is clamped to `max_shift_ids() - 1`, and the entry with `id == slot` is used (zero shift if none). The slot is `slot_index_on_side()` (FR-6.7) for wing, wing-body and open-rotor wing and fuselage placements, but the **engine ID** for turbofan fuselage and empennage placements. No shift is applied to open-rotor empennage engines.

**Application** (`calculate_user_shift(position, shift)`), after mirroring the position of left engines and negating $s_z$ for them:

$$(x,\;y,\;z)\;\leftarrow\;(x+s_x,\;\;y+s_y,\;\;z-s_z) \tag{26}$$

in the frame in which the position is computed. In the wing-local frame (X chord, Y height, Z span) this matches the configuration description (aft, vertical, lateral). In the fuselage-local frame (X width, Y height, Z length) $s_x$ moves the engine sideways and $s_z$ along the fuselage, and for turbofan empennage engines (global frame) $s_y$ moves the engine sideways and $s_z$ vertically, which does not match the description (⚠ O-26). The old settings `repositioning/shift_{x,y,z}` and Eq. 26 of the previous version no longer exist (⚠ O-27).

### 7.6 Open-rotor placement (FR-6.3 – FR-6.5, open-rotor variants)

The span-position function differs from the turbofan one (`calculate_span_position_openrotor`), with $D$ being the diameter passed in:

$$z_e=\begin{cases}\dfrac{w_f}{2}+0.5\,D & N_w=2\\[2mm] 0.64\,\dfrac{b}{2} & N_w=4,\ \text{outer}\\[2mm] \dfrac{0.9}{4}\left(0.64\,b+w_f-D\right) & N_w=4,\ \text{inner}\end{cases} \tag{27}$$

| Placement | $D$ | Span $z_e$ | Chord $x_e$ (wing-local) | Height $y_e$ |
|---|---|---|---|---|
| Under wing | $1.21\,D_{fan}$ | $1.3\times$ Eq. 27 | $0.5\,c(z_e)$ ⚠ O-11 | $y_{c/4}-0.3\,h_{nac}$ |
| Over wing | $D_{fan}$ | Eq. 27 | $0.3\,c(z_e)+x_{LE}(z_e)$ | $y_{c/4}+0.65\,D_{fan}$ |
| In wing | $1.21\,D_{fan}$ | Eq. 27 | $c(z_e)$ (trailing edge) | $0$ |

| Placement (fuselage-local) | $x_e$ (width) | $y_e$ (height) | $z_e$ (length) |
|---|---|---|---|
| Fuselage, not over | $0.2\,w_f(z_e)+w_{nac}$ | $0.65\,h_f(z_e)$ | $\sigma\,0.9\,L_f$ |
| Fuselage top (over) | $0.9\,w_{nac}$ | $1.1\,h_f(z_e)$ | $\sigma\,0.9\,L_f$ |
| Empennage | as Eq. 23 | | |

### 7.7 Engine at wing kink (FR-6.10)

**Configuration:** `program_settings/engine_at_kink` (switch, currently `true` in `propulsion_design_conf.xml`). Placing the engine at the kink avoids extra local wing reinforcement outside the existing kink rib (config description).

**Kink detection** (`Default::find_kink_span_position`, `integration/default/default_integration.cpp`). The kink is the first *interior* wing section where the leading-edge sweep slope changes:

$$\sigma_i^{-}=\frac{x_i-x_{i-1}}{z_i-z_{i-1}},\quad \sigma_i^{+}=\frac{x_{i+1}-x_i}{z_{i+1}-z_i},\quad \big|\sigma_i^{+}-\sigma_i^{-}\big|>10^{-3}\ \Rightarrow\ z_{kink}=z_i \tag{38}$$

Sections with $\lvert z_i\rvert<z_{min}$ are skipped, with $z_{min}=\tfrac{w_f}{2}+\tfrac{D_{max}}{2}-\varepsilon$ (so a fuselage fairing is not mistaken for a kink); sections with zero spanwise spacing are skipped. A wing with fewer than 3 sections has no kink.

**Note on the configuration text.** The description of `engine_at_kink` says "2 engines per wing". The count that the integrator uses ($N_w$) is the number of wing-mounted propulsors in the whole aircraft (`Parent::Wing` plus `Parent::WingBody`, both sides), so $N_w=2$ means one engine per semi-span.

**Wing-mounted turbofan** (`integrate_into_wing`):
- Supported only for $N_w=2$. For other counts a warning is printed and the default span position (Eq. 19) is kept.
- Clearance checks: fuselage $\lvert z_{kink}\rvert-D_{max}/2\ge w_f/2$ and wing tip $\lvert z_{kink}\rvert+D_{max}/2\le b/2$. If both hold, $z_e=z_{kink}$.
- If a check fails, or no kink is found, a warning is printed and the default span position is kept.

**Wing-body turbofan, two engines** (`integrate_into_wing_body`, case $N_w=2$): the engine must also clear the empennage window of §7.4:
$$\lvert z_{kink}\rvert-\tfrac{D_{max}}{2}\ge \text{boundary}_{index},\qquad \lvert z_{kink}\rvert+\tfrac{D_{max}}{2}\le \text{boundary}_{index+1}$$
If it does, $z_e=\lvert z_{kink}\rvert$; otherwise a warning is printed and the default (Eq. 25) is kept. No kink placement exists for the single wing-body engine case and for the open-rotor placements.

</details>

<details id="fr-7-5">
<summary><b>FR-7.5</b> — Pylon construction</summary>

**What it does:** Builds a two-section airfoil surface named `pylon_<id>`, with its axis pointing from the nacelle attachment to the engine position (Eq. 28). Chord lengths follow Table 8.2 and Eq. 39–42.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `pylon::Default::turbofan_method()`, `pylon::Default::openrotorfan_method()`, `pylon::Default::select_wing()`

</details>

**Why it is needed:** The turbofan pylon construction limits its section chords using the engine rear end and the selected wing's trailing edge, with a minimum chord of 0.001 m.

</details>


**Table 8.1 – Attachment points**

| Parent | $P_{nac}$ (nacelle, at axial position 0) | $P_{par}$ (parent) |
|---|---|---|
| Wing | Top of nacelle if the engine is under the wing, bottom if over (decided by the sign of the engine height relative to the leading edge at the engine span station) | Wing leading-edge point at the engine span station |
| Wing-body | Same as wing | Same as wing (the earlier replacement of X by $x_{engine}+x_{nac}$ was removed) |
| Fuselage | Nacelle side facing the fuselage (left if the engine is on the right, and vice versa) | Fuselage side point at the engine's length station (right if local $x>0$, else left) |

Pylon axis direction:

$$\hat n_{pylon}=\frac{\vec r_{engine}-\vec P_{nac}}{\lVert\vec r_{engine}-\vec P_{nac}\rVert} \tag{28}$$

**Table 8.2 – Pylon chord lengths** (current implementation, turbofan; $L$ engine length, $c_{wing}$ and $c_{nac}$ as defined below)

| Engine type | Nacelle-side (root) chord | Wing-side (tip) chord |
|---|---|---|
| Turbofan, under wing | $\min(L,\;L-0.25L)=0.75\,L$ | $c_{wing}$ (Eq. 42) |
| Turbofan, over wing | $\min(L/2,\;0.75L)=0.5\,L$ | $c_{wing}$ (Eq. 42) |
| Open-rotor | $L/2$ | $0.4\,L$ |

**Nacelle-side section.** The attachment point $P_{nac}$ is moved by an inset aft along the nacelle axis and vertically by the enlarged mid-section ($h$ is the engine design height `engine.dimension().height`, not the measured nacelle height $h_{nac}$ used in §7):

$$\vec P_{nac}'=\vec P_{nac}+\Big(0.25\,L,\;0,\;\pm\,0.21\,\tfrac{h}{2}\Big),\qquad \text{sign } +\ \text{under the wing},\ -\ \text{over the wing} \tag{39}$$

and the nacelle-side chord is capped so that it does not extend past the engine's rear end: $c_{nac}\le L-0.25L$.

**Wing-side section.** The desired chord is

$$c_{desired}=\min\big(1.15\,L,\;0.9\,\overline{c}_{MAC,wing}\big) \tag{40}$$

The start of this section is the wing leading-edge point $P_{par}$ under the wing; over the wing it is shifted along the pylon chord direction by $\max\big(0,\;(x_{TE}-x_{LE})-c_{desired}\big)$, so that a full-length chord ends on the trailing edge. The twist-corrected local trailing edge is

$$x_{TE}(z)=x_{LE}(z)+c(z)\cos\theta_{tw}(z) \tag{41}$$

If a chord of length $c_{desired}$ along the pylon chord direction would cross the local trailing edge, the longest fitting chord is found by bisection (20 iterations) and then limited to the range $[0.001\ \text{m},\;c_{desired}]$:

$$c_{wing}=\operatorname{clamp}\big(c_{fit},\;0.001,\;c_{desired}\big) \tag{42}$$

A warning is printed when $c_{fit}<0.3\,L$; the 0.3 L value is only a threshold for this warning. The only hard lower bound is 0.001 m, so the pylon may be shortened below 0.3 L. The construction is intended to avoid overhanging the trailing edge, with one exception: if the fitting chord is smaller than 0.001 m, the 0.001 m minimum is applied and can exceed it.

**Section origins.** Both section origins are expressed relative to the engine position: root origin $=\vec P_{nac}'-\vec r_{engine}$ and tip origin $=\vec P_{start}-\vec r_{engine}$, each rotated into the pylon's local frame. The pylon origin is the global origin, so no translation is added. This matches the exported XML meaning of "position relative to the engine position". **Open-rotor pylon** (`pylon/default/openrotorfan.cpp`, not changed by the later turbofan pylon work): root origin $=\vec P_{nac}-\vec o_{start}$ and tip origin $=\vec P_{par}-\vec o_{end}$ with $\vec o_{start}=\vec r_{engine}-(0.3L,\,0,\,-h/6)$ and $\vec o_{end}=\vec r_{engine}+\vec e+(-1.0,\,-y_{eng}/2,\,0)$, where $y_{eng}$ is the engine's global Y coordinate and $\vec e$ depends on the parent: wing over $(-0.5,\,0.5\,y_{eng},\,-0.8)$, wing under and wing in $(0,\,0.5\,y_{eng},\,0)$, fuselage $(-0.5,\,y_{eng},\,-0.7)$ (metres, not scaled with the engine). Chords: root $L/2$, tip $0.4L$. For other parents the offsets stay zero (⚠ O-18).

**Wing selection.** The pylon designer resolves the wing with its own `select_wing()` (mirroring the integrator's: the wing named in `name_wing_engines`, else the first one with a warning), not blindly `wings[0]`. Like the integrator's version, it reorders the shared wing list as a side effect (`std::rotate`). See ⚠ O-17 for fuselage-mounted engines.

</details>

<details id="fr-8-1">
<summary><b>FR-8.1</b> — Engine mass</summary>

**What it does:** Uses the mass from FR-4 (Eq. 9). Only if that mass is exactly zero does it fall back to the regression of Eq. 29 (⚠ O-7).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `mass::Default::turbofan_method() / openrotorfan_method()`, `calculate_engine_mass() / calculate_engine_mass_openrotor()`

</details>

**Why it is needed:** The engine mass is needed for mass and balance; it normally comes from the engine sizing, and a regression is needed as a fallback when no mass was computed.

</details>

<details id="fr-8-2">
<summary><b>FR-8.2</b> — Engine CG and inertia</summary>

**What it does:** CG on the engine axis at half the engine length; inertia of a solid cylinder (Eq. 30–31). Same for the open-rotor.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `calculate_engine_CG() / calculate_engine_inertia()`, `calculate_engine_CG_openrotor() / calculate_engine_inertia_openrotor()`

</details>

**Why it is needed:** At this design stage the engine is represented by a simplified solid-cylinder model to obtain a centre of gravity and an inertia.

</details>

<details id="fr-8-3">
<summary><b>FR-8.3</b> — Nacelle mass, CG, inertia</summary>

**What it does:** Mass from a thrust regression (Eq. 32). CG is the centroid of the nacelle surface from the geometry library. Inertia comes from the geometry library mesh integration (⚠ O-1).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `calculate_nacelle_mass()`, `calculate_nacelle_CG() / calculate_nacelle_inertia()`, `calculate_nacelle_mass_openrotor()`, `calculate_nacelle_CG_openrotor() / calculate_nacelle_inertia_openrotor()`

</details>

**Why it is needed:** The nacelle mass is estimated from thrust. The centre of gravity and the inertia come from the geometry library's calculation on the nacelle surface, not from that estimated mass (⚠ O-1).

</details>

<details id="fr-8-4">
<summary><b>FR-8.4</b> — Pylon mass, CG, inertia</summary>

**What it does:** Mass from a thrust regression (Eq. 33). CG and inertia as for the nacelle.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `calculate_pylon_mass()`, `calculate_pylon_CG() / calculate_pylon_inertia()`, `calculate_pylon_mass_openrotor()`, `calculate_pylon_CG_openrotor() / calculate_pylon_inertia_openrotor()`

</details>

**Why it is needed:** The pylon mass is estimated from thrust. The centre of gravity and the inertia come from the geometry library's calculation on the pylon surface, not from that estimated mass (⚠ O-1).

</details>

<details id="fr-8-5">
<summary><b>FR-8.5</b> — Embedded engines</summary>

**What it does:** If the pylon has no sections (FR-7.1), the pylon point mass is left at its default (zero mass, zero CG, zero inertia).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `mass::Default::turbofan_method() / openrotorfan_method()`

</details>

**Why it is needed:** Engines without a pylon must still give consistent mass results, so a zero pylon mass is defined instead of an error.

</details>

<details id="fr-8-6">
<summary><b>FR-8.6</b> — Component combination</summary>

**What it does:** Adds point masses using mass-weighted CG and the parallel-axis (Steiner) theorem (Eq. 34–36). There is no guard against a total mass of zero (⚠ O-14).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `operator+(PointMass, PointMass)`, `Propulsion::total_mass()`

</details>

**Why it is needed:** The component mass properties are combined using the implemented mass-weighting and parallel-axis relations to obtain aggregate values for one engine and for the whole propulsion system.

</details>

<details id="fr-8-7">
<summary><b>FR-8.7</b> — Frame conversion</summary>

**What it does:** Component CGs are stored in the engine-local frame. Before export, each CG is shifted by the engine's global position (translation only, no rotation) and shifted back afterwards (FR-9.3).

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `Propulsion::change_to_global_reference_frame() / revert_to_local_reference_frame()`, `PropulsionDesign::update()`

</details>

**Why it is needed:** The aircraft file expects centres of gravity in the global coordinate system, whereas the calculation is done relative to each engine.

</details>

<details id="fr-8-8">
<summary><b>FR-8.8</b> — Technology factors</summary>

**What it does:** $f_m$, $f_n$, $f_p$ from the config multiply the respective masses.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `MassAnalyzer::initialize() / technology_factor()`

</details>

**Why it is needed:** Studies with lighter or heavier components should be possible from the configuration file.

</details>


**Equations** (thrust $T$ in N, masses in kg; regression from [Pet13])

$$m_{eng}^{fallback}=f_m\,(0.0159\,T+306.57)\qquad\big(\times 1.2\ \text{for open-rotor}\big) \tag{29}$$

Engine CG and inertia (engine-local frame, origin at the centre of the fan; $r=\tfrac14(h+w)$ is the average radius):

$$\vec r_{CG,eng}=\Big(\tfrac12 L,\;0,\;0\Big) \tag{30}$$

$$I_{xx}=\tfrac12\,m\,r^{2},\qquad I_{yy}=I_{zz}=\tfrac1{12}\,m\,(3r^{2}+L^{2}) \tag{31}$$

$$m_{nac}=f_n\,(0.0039\,T+595.42) \tag{32}$$

$$m_{pyl}=f_p\,(0.0024\,T+233.29)\qquad\big(\times 1.5\ \text{for open-rotor, "MT guess" in the code}\big) \tag{33}$$

Nacelle and pylon CG: $\vec r_{CG}=$ `to_parent(surface, centroid(surface))`. The nacelle and pylon inertia is `geom2::measure::inertia(surface)`.

Combination of two point masses $a$ and $b$ (`operator+` in `point_mass.cpp`):

$$m=m_a+m_b,\qquad \vec r_{CG}=\frac{m_a\vec r_a+m_b\vec r_b}{m} \tag{34}$$

$$\vec d_j=\vec r_j-\vec r_{CG},\quad j\in\{a,b\} \tag{35}$$

$$I_{xx}=\sum_j\big(I_{xx,j}+m_j(d_{y,j}^{2}+d_{z,j}^{2})\big),\;\; I_{yy},I_{zz}\ \text{analogous};\qquad I_{xy}=\sum_j\big(I_{xy,j}+m_j\,d_{x,j}d_{y,j}\big)\ \text{etc.} \tag{36}$$

The same operator is used to build the per-engine total and the total of all engines (FR-9.2). The off-diagonal sign convention should be checked (⚠ O-8).

</details>

<details id="fr-10-5">
<summary><b>FR-10.5</b> — HTML report</summary>

**What it does:** Created whenever `report_output` is enabled (before the plot step). Content: (a) design summary: total SLST, and for "max. take-off with offtakes", "bucket point with offtakes" and "bucket point without offtakes" the thrust, fuel flow and TSFC; (b) list of installed engine models; (c) one table per engine (model, scale factor, SLST, engine mass `pointmass(Engine).mass`, bucket thrust, bucket TSFC); (d) only if `plot_output/enable` is true: the bucket-curve plot, the top view, and front and side views of every nacelle. Note that the engine table shows the engine mass only, not the nacelle or pylon mass.

<details>
<summary><b>Software requirements</b></summary>

**Implemented by:** `PropulsionDesign::create_html_report()`, `insert_summary() / insert_engine() / insert_nacelle() / insert_plots()`, `report::name_*()` (plot file names)

</details>

**Why it is needed:** A readable report of the design results is needed for review and documentation.

</details>


**Bucket curve for the report** (`report_data.cpp`, $n=100$ points):

$$N1_j=N1_{min}+j\,\frac{N1_{max}-N1_{min}}{n-1},\quad j=0\ldots n-1 \tag{37}$$

$$F_j=\sum_{\text{engines}}F_e(N1_j),\qquad \dot w_{f,j}=\sum_{\text{engines}}\dot w_{f,e}(N1_j),\qquad TSFC_j=\frac{\dot w_{f,j}}{F_j}$$

The reported bucket point is the minimum of $TSFC_j$. Note that the report curve sums all engines at the same N1 index (as a grid), whereas the sizing-stage bucket point (Eq. 13) is searched per engine.

</details>
