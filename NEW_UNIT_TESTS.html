# New unit tests for `propulsion_design`

This document describes the unit tests added to the `test_propulsion_design` executable. For each test it gives:

- the functional requirement (FR) it verifies, as numbered in [FUNCTIONAL_REQUIREMENTS.html](FUNCTIONAL_REQUIREMENTS.html);
- the functionality under test;
- how the test works (setup, action, check) and where its expected values come from.

No production code was changed for these tests. Only test files, two shared test helpers and `test/CMakeLists.txt` were added or changed.

---

## 2. Building and running

From `aircraft_design`:

```bash
cmake --build build --config Debug --target test_propulsion_design
cd build/propulsion_design/test
./Debug/test_propulsion_design.exe                       # all tests
./Debug/test_propulsion_design.exe --gtest_filter=BucketCurve.*
```

- **Working directory:** run from `build/propulsion_design/test`. The energy-carrier database is found by searching upwards from the current directory, and the build copies it to `build/propulsion_design/test/databases/general_data/`.
- **Filters for the new suites:**

| Suites | Filter |
|---|---|
| Bucket curve | `BucketCurve.*` |
| Deck scaling | `ScaleDeckDataValues*` |
| Rubber adjustment | `RubberEfficiencyFactor.*` |
| Open-rotor mass | `Openrotorfan*` |
| Profile files | `*ProfileFile.*` |
| Database without engines | `EngineDesignRubber.*Database*` |

  ```cmake

### 2.2 Shared helpers

**[test/temp_directory.h](test/temp_directory.h)**

`UniqueTempDirectory` creates a new, empty folder in the system temp directory, named `<prefix>_<random 64-bit number>`. It deletes the folder in its destructor, including when an assertion fails.

Every test that writes files uses it:
- the Rubber tests;
- the deck round-trip test;
- the profile-file tests;
- the empty-database test.

This means:
- no test writes into the repository (`test/stubs/` stays unchanged);
- parallel or repeated runs cannot collide on a fixed folder name;
- nothing is left behind in the temp folder.

**[test/pylon/default/pylon_test_geometry.h](test/pylon/default/pylon_test_geometry.h)**

`PylonTestGeometry` builds the aircraft geometry of the pylon tests once: a unit-diameter nacelle (also used as fuselage) and a symmetric wing with chord 2.0 at the root and 1.0 at z = −5. Both `PylonDefault` and `PylonProfileFile` derive from it, so the two fixtures cannot drift apart.

## 3. FR-10.2 / FR-10.3 — Bucket curve (`BucketCurve`, 13 tests)

**File:** [test/report/test_report_data.cpp](test/report/test_report_data.cpp)

**Unit under test:** `report::BucketCurve` in [src/report/report_data.h](src/report/report_data.h) / [.cpp](src/report/report_data.cpp).

**Behaviour under test:**
- A curve holds two arrays, thrust and fuel flow.
- `tsfc()` is fuel flow / thrust, element by element.
- `bucket_point()` is the thrust and TSFC at the smallest TSFC (`std::min_element`).
  - The non-const overload caches the result.
  - The const overload computes it if nothing is cached.
- `operator+` and `operator+=` add both arrays element by element; `+=` also clears the cached point.
- `report::generate_data()` uses `+=` to sum the per-engine curves into the aircraft totals.

**How the tests work:** each test builds curves from small arrays whose TSFC values can be checked by hand, calls one operation, and compares with `EXPECT_NEAR` (tolerance 1e-12). No files or configuration are needed.

| Test | FR | Input | Check |
|---|---|---|---|
| `DefaultSize` | 10.2 | `BucketCurve{}` | Thrust and fuel-flow arrays have `report::bucket_points` (100) entries. |
| `ConstructorAndSetters` | 10.2 | Constructor `{100, 200}/{1, 3}`, then `set_thrust({10, 20, 30})`, `set_fuel_flow({0.1, 0.2, 0.3})` | The arrays hold exactly the given values. |
| `TsfcIsFuelFlowOverThrust` | 10.3 | Thrust `{100, 200, 400}`, fuel flow `{1, 1, 2}` | `tsfc() = {0.01, 0.005, 0.005}`. |
| `BucketPointAtMinimumTsfc` | 10.3 | `{100, 200, 300}/{2, 1, 3}` → TSFC 0.02, 0.005, 0.01 | Bucket point = (200, 0.005). |
| `BucketPointAtCurveEnds` | 10.3 | Minimum at index 0 (`{0.5, 2, 3}`) and at the last index (`{2, 3, 0.3}`) | Thrust 100 and 300; the search covers both ends. |
| `BucketPointTieTakesFirst` | 10.3 | TSFC 0.01, 0.005, 0.005 | The first minimum is returned (thrust 200). |
| `ConstBucketPointMatches` | 10.3 | Same curve through a `const&` before caching, the non-const overload (caches), and `const&` after caching | All three give the same point. |
| `UpdateBucketPoint` | 10.3 | `update_bucket_point()`, then the const overload | (200, 0.005). |
| `AdditionIsElementWise` | 10.2 | `{100, 200, 300}/{2, 1, 3}` + `{50, 100, 150}/{0.5, 1.5, 0.5}` | Sum = `{150, 300, 450}/{2.5, 2.5, 3.5}`; both operands unchanged. |
| `BucketPointOfSumUsesSummedCurve` | 10.2/10.3 | Operand minima at index 1 and index 2; sum TSFC 0.0125, 0.01, 0.00775 | Sum bucket point = (400, 3.1/400): taken from the summed curve, not by adding the two bucket points. |
| `PlusAssignMatchesPlus` | 10.2 | `a += b` vs `a + b` | Identical arrays. |
| `PlusAssignInvalidatesCachedBucketPoint` | 10.2/10.3 | Cache bucket point (200), then `+=` a curve that moves the minimum | Both overloads now return 400: `+=` cleared the cache. |
| `AccumulateFromDefaultCurve` | 10.2 | Default (all-zero, 100-point) curve, then `+=` the same 100-point engine curve twice (thrust 1000 + 10i, fuel flow 0.02 + 0.0001i) | Total = 2 × engine arrays; total TSFC = engine TSFC. This is how `generate_data()` builds the totals. |

**Not tested, on purpose:**
- **Zero thrust:** division by zero gives `inf`/`NaN`, and `min_element` has no defined result. A default curve is all zeros, so `bucket_point()` on an unfilled curve falls into this case.
- **Arrays of different length:** `std::valarray` arithmetic on mismatched sizes is undefined behaviour.

## 4. FR-4.8 — Deck scaling by the engine-efficiency factor

**File:** [test/engine_design/test_engine_design.cpp](test/engine_design/test_engine_design.cpp)

### 4.1 `ScaleDeckDataValues` (7 tests)

**Unit under test:** `design::EngineDesigner::scale_deck_data_values(DeckData&, double f)` ([src/engine_design/engine_design.cpp](src/engine_design/engine_design.cpp)).
- It multiplies every deck value by **1 + (1 − f) = 2 − f**.
- It leaves the placeholder `-9999` unchanged.
- It modifies the deck passed in **and** returns a copy.

**Fixture:**
- **Designer:** `design::EngineDesigner{nullptr, {}, {}}`. The constructor only stores its arguments, so no configuration or files are needed.
- **Deck:** a hand-made 2 × 2 × 2 `DeckData`:
  - N = {0.8, 1.0}, FL = {0, 10000}, Mach = {0, 0.8};
  - values 100, 200, −9999, 50 / 0, −9999, 1.5, 400, defined once in the table `INPUT` and copied into the deck in `SetUp()`.
  - Three dimensions are used so that a loop that skipped an index would be caught.
- **Check:** the helper `expect_scaled()` compares every cell with `INPUT × factor` (or −9999) within 1e-9. Some tests also check results as literal numbers (90, 180, 440), as checks that do not depend on the table.

| Test | Input | Check |
|---|---|---|
| `FactorAboveOneReducesValues` | f = 1.1 | 100 → 90, 200 → 180, −9999 kept; all cells × 0.9. |
| `FactorOneLeavesValuesUnchanged` | f = 1.0 | All cells unchanged. |
| `FactorBelowOneIncreasesValues` | f = 0.9 | 400 → 440; all cells × 1.1. |
| `PlaceholderNeverScaled` | f = 0.5, 0.9, 1.0, 1.1, 1.5 | Both −9999 cells stay exactly −9999. |
| `ModifiesInputInPlace` | f = 1.1 | The deck passed in is scaled as well, and equals the returned copy. This pins down the side effect; a change to that behaviour would make the test fail. |
| `MetadataUnchanged` | f = 1.1 | Name, N, FL, Mach and the 2 × 2 × 2 shape are unchanged. |
| `EmptyDeck` | Default `DeckData` | No error; the result is empty. |

### 4.2 `ScaleDeckDataValuesDeckFile` (2 tests)

These repeat the check on a deck file instead of a hand-made table.
- **File used:** `test/stubs/engines/test-engine/test-engine_WF.csv`, the fuel-flow deck of the test-engine stub (not a production engine), in the engine-database CSV format with 1976 `-9999` cells.
- **Reader:** it is loaded with the module's own `DeckData::from_csv()`.

| Test | How it works | Check |
|---|---|---|
| `ScalesEveryValueOfDeckFile` | Load the deck twice (original and working copy), scale the copy with f = 1.1. | Every cell: −9999 unchanged, otherwise 0.9 × original (relative 1e-12). The file must contain both kinds of cell, so both branches run. |
| `WriteAndReadBackScaledDeck` | Scale, write with `EngineDesigner::write_deck_value()`, read back with `from_csv()`. | The deck keeps its file name `test-engine_WF`, and the written file is literally `<temp>/test-engine/test-engine_WF.csv`, i.e. the original WF file is overwritten (what `Rubber` relies on). N, FL and Mach identical; every value within relative 1e-5. `write_deck_value()` writes with the default stream precision of 6 significant digits, so each save rounds the values (§9.2). |

## 5. FR-4.8 / FR-4.9 — Factor applied by `Rubber` (`RubberEfficiencyFactor`, 11 tests)

**File:** [test/engine_design/test_engine_design.cpp](test/engine_design/test_engine_design.cpp)

**Unit under test:** `design::Rubber::initialize()` and `design::Rubber::save()` ([src/engine_design/rubber/rubber_design.cpp](src/engine_design/rubber/rubber_design.cpp)).

**What the code does:**
- `initialize()` adjusts every preselected engine that already exists in the project engine folder.
- `save()` copies every designed engine that is not yet in the project from the database, then adjusts the copy.
- An adjustment happens when the factor stored in the engine XML (`EngineTechnologyFactor`, f_old) differs from the configured factor `technology_factors/engine_efficiency` (f) by more than 1e-6. It then:
  1. sets the designer's factor to f_new = 2 − (2 − f)/(2 − f_old);
  2. scales the WF deck by 2 − f_new = (2 − f)/(2 − f_old) and overwrites `<model>_WF.csv`;
  3. writes f into the engine XML.

**Requirement checked by the tests:** after adjustment the WF deck equals **base deck × (2 − f)** and the XML stores **f**, whatever f_old was. Here "base deck" means the unadjusted deck.

**Fixture:**
- **Folders:** a unique temp folder with a `project/` (project engine folder) and a `database/` (engine database).
- **Configuration:** the module configuration (`CMAKE_TEST_CONFIG_FILE`) with Default model `test-engine` and `path_engine_database` = `database/`. The configured factor f is set per test.
- **`make_engine(folder, model, f_old)`** builds a consistent "previously adjusted" engine:
  - copies the stub `test-engine.xml` as `<model>.xml`;
  - adds `EngineTechnologyFactor = f_old` (the stub XML has no such node; without it, `Rubber` hits an error and calls `exit()`, which would stop the whole test program);
  - writes `<model>_WF.csv` = stub deck × (2 − f_old), written by the test at full precision, not by the code under test. `write_deck()` asserts that the file was opened and written.
  - `make_engine()` contains fatal assertions. A fatal assertion in a helper only returns from the helper, so every call is wrapped as `ASSERT_NO_FATAL_FAILURE(make_engine(...))`; a broken fixture then stops the test instead of producing follow-on errors.
- **`add_marker()` / `has_marker()`** add and look for a `TestMarker` node in an engine XML (used to detect that a project engine was replaced).
- **`expect_deck(folder, model, factor)`** reads the WF deck back and requires every cell to equal base × factor (−9999 unchanged, relative 1e-5). It reports the first 3 mismatches with the actual ratio to the base deck.
  - It contains a fatal assertion on the deck size, so every call is wrapped as `ASSERT_NO_FATAL_FAILURE(expect_deck(...))`: a deck of the wrong size stops the test.
  - Wrong values are reported with the non-fatal `ADD_FAILURE`, so they do not stop the test. A test that checks two engines (A and B) therefore still reports both.
- **`stored_factor(folder, model)`** reads `EngineTechnologyFactor` back from the XML on disk.
- **Tolerances** allow for the configured factor being read as `float` and the deck being written with 6 significant digits.

| Test | Setup | Action | Check | Result |
|---|---|---|---|---|
| `InitializeReadjustsPreviouslyAdjustedEngine` | Project engine, f_old = 1.05; f = 1.1 | `initialize()` | Deck = base × 0.9; XML = 1.1; designer factor = 2 − 0.9/0.95 | pass |
| `InitializeSameFactorLeavesEngineUnchanged` | f_old = f = 1.05 | `initialize()` | Deck = base × 0.95 (unchanged); XML = 1.05 | pass |
| `InitializeTwiceScalesOnce` | f_old = 1.05; f = 1.1 | `initialize()` on two designers in a row | Deck = base × 0.9, not scaled twice; XML = 1.1 | pass |
| `InitializeDoesNotTouchDatabase` | Engine only in the database (f_old = 1.0); f = 1.1 | `initialize()` | Database deck and XML unchanged; nothing created in the project | pass |
| `SaveCopiesAndAdjustsNewEngine` | Engine only in the database (f_old = 1.0); f = 1.1; `add_designed_engine("test-engine")` | `save()` | Engine copied to the project; project deck = base × 0.9, project XML = 1.1; database deck and XML unchanged | pass |
| `SaveWithNeutralFactorCopiesUnchanged` | As above, f = 1.0 | `save()` | Project deck = base, XML = 1.0 | pass |
| `SaveSkipsEngineAlreadyInProject` | Engine in database (1.0) and project (1.1); marker node added to the project XML; f = 1.1 | `save()` | Marker still present; project engine unchanged (base × 0.9, XML 1.1). The marker is needed because a re-copy from the database followed by a re-adjustment would give the same deck and factor. | pass |
| `InitializeFactorWithinThresholdNotAdjusted` | f_old = 1.05; f = 1.05 + 4×10⁻⁷ (about 4×10⁻⁷ apart also after the float conversion) | `initialize()` | Deck file text unchanged (not rewritten); XML still exactly 1.05 | pass |
| `InitializeFactorOutsideThresholdAdjusted` | f_old = 1.05; f = 1.05 + 4×10⁻⁶ | `initialize()` | Deck file rewritten (its text changes, because `Rubber` writes its own format); deck = base × (2 − f); XML = f within 2×10⁻⁷ and more than 2×10⁻⁶ away from 1.05 | pass |
| `InitializeAdjustsEachOverriddenModelOnce` | Default model A = `test-engine`, override for propulsor ID 1 with model B = `test-engine-b`; both in the project with f_old = 1.05; f = 1.1 | `initialize()` | Requirement: A and B each = base × 0.9, both XML = 1.1 | **fail** (§9.1) |
| `SaveAdjustsCopiedOverrideModel` | A and B in the database (1.0); override ID 1 → B; only B designed; f = 1.1 | `save()` | Requirement: `save()` does not throw (`ASSERT_NO_THROW`, so the test stops at an exception); then project B = base × 0.9, XML = 1.1 | **fail** (§9.1): `save()` throws, the test stops there |

The two threshold tests use values well inside and well outside the 1e-6 threshold, because the configured factor is read as `float` (resolution about 1.2×10⁻⁷ near 1.05). The engine XML stores doubles with 10 significant digits, so the stored factor shows the difference. The deck values differ by only 4×10⁻⁶ relative, which is below the deck tolerance; the rewrite is therefore detected through the file text.

`add_designed_engine()` is public, so `save()` is tested directly without running a full engine sizing. A full sizing is not possible with the stub engine, which lacks `test-engine_St2_W.csv`.

## 6. FR-4.1 — Engine database without engines (2 tests)

**File:** [test/engine_design/rubber/test_rubber_turbofan.cpp](test/engine_design/rubber/test_rubber_turbofan.cpp), next to `DesignTurbofanKeroseneAutomaticallySelected`.

**Unit under test:** the automatic engine selection in `design::Rubber`. When no model is preselected, `Rubber::operator()(Turbofan&)` calls `Rubber::select_engine()`. That function lists the folders in the database and throws `std::runtime_error("No engine found in the database")` if there are none.

**`DesignTurbofanKeroseneEmptyDatabase`:**
1. Load the module configuration and delete `propulsion@Default/Rubber/engine_model`, so there is no preselection (the same technique as the existing auto-selection test).
2. Set `path_engine_database` to a new, empty `UniqueTempDirectory`.
3. Create `design::Rubber`, call `initialize()`, and give a kerosene turbofan a required thrust of 110.31 kN.
4. Call `designer(engine)` inside `try`:
   - if nothing is thrown, `FAIL()`;
   - in `catch (std::runtime_error&)`, require the message to contain "No engine found in the database".

**`DesignTurbofanKeroseneDatabaseWithoutEngineFolders`:** the same steps, but the database folder contains only files: a copy of `test-engine.xml` (not inside an engine folder) and a `README.txt`. `select_engine()` only takes folders as engines, so the result must be the same "No engine found in the database" error.

## 7. FR-8.1 – FR-8.6, FR-8.8 — Open-rotor mass

**File:** [test/mass/default/test_default_openrotorfan.cpp](test/mass/default/test_default_openrotorfan.cpp)

**Unit under test:** [src/mass/default/openrotorfan.cpp](src/mass/default/openrotorfan.cpp). This file was not executed by any test before. It contains:
- the free functions `calculate_*_openrotor` (engine, nacelle, pylon: mass, CG, inertia);
- `mass::Default::operator()(Openrotorfan<Kerosene>&)`.

**Formulas (from the source; expected values are calculated by hand from them):**

| Quantity | Formula |
|---|---|
| Engine mass | m_e = f_m (0.0159 T + 306.57) × 1.2 |
| Nacelle mass | m_n = f_n (0.0039 T + 595.42) |
| Pylon mass | m_p = f_p (0.0024 T + 233.29) × 1.5 |
| Engine CG | (L/2, 0, 0) |

## 8. FR-5.1, FR-5.2 / FR-7.3 — Profile files

**Units under test:**
- `geometry::nacelle::Default::get_section_shape()` ([src/nacelle/default/default_nacelle.cpp](src/nacelle/default/default_nacelle.cpp), creation branch from line 90);
- `geometry::pylon::Default::get_section_profile()` ([src/pylon/default/default_pylon.cpp](src/pylon/default/default_pylon.cpp), creation branch from line 307).

If the configured `.dat` file does not exist in the geometry directory, each function:
1. creates any missing directories;
2. writes a built-in default profile;
3. reads it back.

The existing tests always use `test/stubs/`, where both files already exist, so this branch was never executed before.

**Reference data, checked before the tests were written:**
- **Pylon:** the generated profile is numerically identical to `test/stubs/pylon.dat` (all 202 points).
- **Nacelle:** the generated profile equals the first 40 points of `test/stubs/nacelle.dat`; the stub only repeats the first point at the end.

So a part designed from a freshly generated file must equal one designed from the stub file. That comparison needs no hard-coded geometry. It is also unaffected by the existing nacelle test's 1.25 vs 1.21 expectation (O-16).

### 8.1 Nacelle (`NacelleProfileFile`, 6 tests)

**File:** [test/nacelle/default/test_default_profile_file.cpp](test/nacelle/default/test_default_profile_file.cpp)

**Fixture:**
- module configuration (profile `nacelle.dat`);
- an empty `UniqueTempDirectory` as geometry directory;
- the turbofan of the existing `LargeFanShortDuct` test (dimensions 1 × 2 × 3 m, fan diameter 2.5 m).

| Test | How it works | Check |
|---|---|---|
| `CreatesMissingProfileFile` | Assert the file is absent, design the nacelle; read the created file as plain text. | `nacelle.dat` exists; 40 points; point k = (0.5 cos(9k°), 0.5 sin(9k°)) (±1e-5; the file has 5 decimals), i.e. a circle of diameter 1, in order, counter-clockwise from (0.5, 0); nacelle has sections. |
| `CreatedProfileGivesSameNacelleAsStub` | Design once with the temp directory (file created) and once with `test/stubs/`. | Both have 4 sections; same name, origin, normal; each section has name `nacelle`, the same origin and the same bounding-box width and height (1e-9). The inlet section is 2.5 m (the fan diameter). |
| `SecondRunReadsExistingFile` | First run creates the circle (40-point sections). Then the file is replaced by a square; second run. | File still contains the square (not overwritten); every section has 4 vertices and fills its bounding box (area ratio 1, a circle gives about π/4). A different shape is needed: the designer rescales every profile to the required width and height, so a circle of another size would give the same sections. |
| `CreatesMissingSubdirectory` | Profile set to `profiles/nacelle.dat`. | `profiles/` and the file are created; the nacelle has 4 sections. |
| `UncreatableProfilePathThrows` | A regular file `blocker` in the geometry directory; profile `blocker/nacelle.dat`. | `std::runtime_error` containing "Error while creating the file for nacelle." |
| `UnsupportedProfileThrows` (FR-5.1) | Profile `Triangle`. | `std::invalid_argument` containing "The nacelle shape 'triangle' is not supported." (the name is converted to lower case). |

### 8.2 Pylon (`PylonProfileFile`, 6 tests)

**File:** [test/pylon/default/test_default_profile_file.cpp](test/pylon/default/test_default_profile_file.cpp)

**Fixture:**
- the shared geometry of `pylon_test_geometry.h` and the under-wing engine of the existing `PylonDefault.DesignTurbofanKeroseneUnderWing` test (engine 0.8 × 0.8 × 1.5 m, fan 0.9 m, position (2, 3, −1), right wing, under);
- module configuration (profile `pylon.dat`);
- an empty `UniqueTempDirectory` as geometry directory.

| Test | How it works | Check |
|---|---|---|
| `CreatesMissingProfileFile` | Assert the file is absent, design the pylon. | `pylon.dat` exists; 202 points from (0, 0) to (1, 0); 2-section pylon, section name `pylon`. |
| `CreatedProfileMatchesNacaFormula` | Read the created file as plain text, without the geometry library's reader. | Header `#NACA0012`; 202 points; every point checked against the formula below (±1e-7; the file has 8 decimals). |
| `CreatedProfileGivesSamePylonAsStub` | Design once with the temp directory and once with `test/stubs/`. | Same section count (2), origin, normal; each section has the same name, origin, chord and bounding box (1e-12). |
| `SecondRunReadsExistingFile` | First run creates the NACA 0012 file (202-point sections). Then the file is replaced by a 4-point diamond with thickness 0.4; second run. | File still contains the diamond; both sections have 4 vertices and a thickness ratio of 0.4 (the chord scaling keeps the ratio; NACA 0012 has 0.12). |
| `CreatesMissingSubdirectory` | Profile set to `profiles/pylon.dat`. | `profiles/` and the file are created; the pylon has 2 sections. |
| `UncreatableProfilePathThrows` | A regular file `blocker` in the geometry directory; profile `blocker/pylon.dat`. | `std::runtime_error` containing "Error while creating the file for pylon." |

**Formula used by `CreatedProfileMatchesNacaFormula`** (NACA 4-digit thickness, t = 0.12):

- x_i = ½ (1 − cos(π i / 100)), i = 0 … 100 (cosine spacing)
- |y| = 5t (0.2969 √x − **0.1281** x − 0.3516 x² + 0.2843 x³ − 0.1015 x⁴)

**File layout:**
- points 0–100: upper surface (+y) from (0, 0) to (1, 0);
- points 101–201: lower surface (−y) from (0, 0) to (1, 0).

The coefficients were found by a least-squares fit of all five coefficients to the 99 upper-surface points (residual 1.6 × 10⁻⁸, i.e. the 8-decimal rounding). They differ from the commonly published set (§9.5).

## 9. Findings from the new tests

### 9.1 Defect: per-engine model overrides adjust the wrong deck (FR-4.8)

**Shown by:** `RubberEfficiencyFactor.InitializeAdjustsEachOverriddenModelOnce` and `SaveAdjustsCopiedOverrideModel` (both fail).

**Cause:** in both `Rubber::initialize()` and `Rubber::save()`, the deck file name is read from the first `engine_model` entry of the configuration (the Default one), not from the engine being processed ([rubber_design.cpp:67](src/engine_design/rubber/rubber_design.cpp#L67) and [:132](src/engine_design/rubber/rubber_design.cpp#L132)). The engine XML that is read and written does belong to the engine being processed.

**Measured effect** (Default model A, override model B, f = 1.1; f_old = 1.05 for the project engines in the `initialize()` case, 1.0 for the database engines in the `save()` case):

| Path | A deck | B deck | B XML |
|---|---|---|---|
| Requirement (both cases) | base × 0.9 | base × 0.9 | 1.1 |
| `initialize()` | base × 0.8526 = 0.95 × (0.9/0.95)², scaled twice | base × 0.95, not scaled | 1.1, so XML and deck disagree |
| `save()`, only B designed | — | not adjusted (base × 1.0) | 1.0 |

In the `save()` case it throws `std::runtime_error` "Could not open file: …\project\test-engine\test-engine_WF.csv", because A was never copied to the project. The B values in that row were measured with an earlier version of the test, which carried on after the exception. The current test uses `ASSERT_NO_THROW` and stops at the exception, which is the root cause, so it no longer reports them.

### 9.2 Deck precision on save (FR-4.8)

`EngineDesigner::write_deck_value()` writes values with the default stream precision (6 significant digits). Every adjustment that rewrites a deck rounds it. Seen in `ScaleDeckDataValuesDeckFile.WriteAndReadBackScaledDeck`.

### 9.3 Deck scaling modifies its input (FR-4.8)

`scale_deck_data_values()` takes the deck by non-const reference and scales it in place, as well as returning a copy. Pinned down by `ScaleDeckDataValues.ModifiesInputInPlace`.

### 9.4 Nacelle and pylon inertia are not scaled by mass (FR-8.3 / FR-8.4)

For the open rotor, the nacelle and pylon inertia are the geometry library's surface inertia and do not change with the component mass. Pinned down by `OpenrotorfanMassAnalyzer.NacelleAndPylonInertiaNotScaledByMass`.

### 9.5 Pylon default profile coefficients (FR-7.3)

The generated `pylon.dat` uses **−0.1281** for the linear thickness term:
- **Commonly published open-trailing-edge set:** −0.1260. The points deviate from it by up to 1.3 × 10⁻³ of the chord.
- **Other common closed-edge set** (−0.1036 for the x⁴ term): deviation up to 6 × 10⁻⁴.

With −0.1281 the five coefficients sum to 0, so the trailing edge closes at x = 1. The test records the coefficients the module uses; it does not assess the choice.

### 9.6 Test stub and existing tests

- **Missing XML node:** `test/stubs/engines/test-engine/test-engine.xml` has no `EngineTechnologyFactor` node. If `Rubber` tries to adjust it, `set_engine_efficiency_factor()` throws, and `Rubber` catches that and calls `exit(EXIT_FAILURE)`. The new tests therefore add the node to their temporary copies.
- **Missing deck file:** the stub engine also lacks `test-engine_St2_W.csv`, so a full engine sizing with it fails. This is the cause of 3 of the pre-existing `EngineDesignRubber` failures.
- **Outdated expectation:** the pre-existing `EngineDesignRubber.ChangeTechnologyFactor` expects `initialize()` to throw. With an empty engine directory no adjustment takes place, so nothing is thrown. `RubberEfficiencyFactor.InitializeDoesNotTouchDatabase` confirms this behaviour.

## 11. Limits of the new tests

- **Not production engine data.** The engine data is the repository's `test-engine` stub (real CSV format, but not a production engine), with an added XML node and constructed adjustment histories. The tests verify the logic for any engine in this format, not a specific database engine.
- **Model selection during sizing is untested.** Per-propulsor model selection during sizing (FR-4.1) needs a complete engine deck. The override tests in §5 cover the FR-4.8 adjustment only.
- **Not all of FR-10.2 is covered.** `report::generate_data()` and `BucketCurve::from_engine_data()` need a real `Engine` and remain untested.
- **No full module runs.** The tests call single functions or strategies. FR-1 (lifecycle) is not covered by these tests.
